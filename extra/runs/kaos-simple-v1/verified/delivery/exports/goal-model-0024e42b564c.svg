<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="558" role="img" aria-label="目标层级文字图"><rect width="100%" height="100%" fill="#f5f8f7"/>
<text x="28" y="36" font-size="20" font-family="sans-serif" xml:space="preserve"># 目标模型</text>
<text x="28" y="62" font-size="20" font-family="sans-serif" xml:space="preserve"></text>
<text x="28" y="88" font-size="20" font-family="sans-serif" xml:space="preserve">版本：v1。人工待审。</text>
<text x="28" y="114" font-size="20" font-family="sans-serif" xml:space="preserve"></text>
<text x="28" y="140" font-size="20" font-family="sans-serif" xml:space="preserve">- 有效申请得到登记，并收到有效回执</text>
<text x="28" y="166" font-size="20" font-family="sans-serif" xml:space="preserve">  以下各项都需满足</text>
<text x="28" y="192" font-size="20" font-family="sans-serif" xml:space="preserve">    - 有效申请得到完整登记</text>
<text x="28" y="218" font-size="20" font-family="sans-serif" xml:space="preserve">    - 有效回执送达</text>
<text x="28" y="244" font-size="20" font-family="sans-serif" xml:space="preserve">      方案 1（任选一个完整方案；方案内全部满足）</text>
<text x="28" y="270" font-size="20" font-family="sans-serif" xml:space="preserve">        - 收到邮件回执</text>
<text x="28" y="296" font-size="20" font-family="sans-serif" xml:space="preserve">      方案 2（任选一个完整方案；方案内全部满足）</text>
<text x="28" y="322" font-size="20" font-family="sans-serif" xml:space="preserve">        - 收到短信回执</text>
<text x="28" y="348" font-size="20" font-family="sans-serif" xml:space="preserve"></text>
<text x="28" y="374" font-size="20" font-family="sans-serif" xml:space="preserve">## 需要确认</text>
<text x="28" y="400" font-size="20" font-family="sans-serif" xml:space="preserve"></text>
<text x="28" y="426" font-size="20" font-family="sans-serif" xml:space="preserve">- 本示例为合成资料与开发判断，用于审核新版表达方式，不代表真实资料准确率。</text>
<text x="28" y="452" font-size="20" font-family="sans-serif" xml:space="preserve"></text>
<text x="28" y="478" font-size="20" font-family="sans-serif" xml:space="preserve">原文与层级依据可在 HTML 中展开。结构检查不等于语义证明，意见导出后交回助手。</text>
</svg>