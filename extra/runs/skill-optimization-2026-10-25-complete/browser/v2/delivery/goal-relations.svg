<svg xmlns="http://www.w3.org/2000/svg" width="820" height="442" viewBox="0 0 820 442" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R1" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="90" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="141">有效申请得到完整登记 → 有效申请得到登记，并收到有效回执</text></g><g data-relation="R2" role="button" tabindex="0" aria-label="待确认联系 · 实现方式"><rect x="20" y="178" width="780" height="74" rx="8" fill="#fafafa" stroke="#8b6725" stroke-dasharray="5 4"/><text x="36" y="203" fill="#8b6725">待确认联系 · 实现方式</text><text x="36" y="229">有效申请得到完整登记 → 有效申请得到登记，并收到有效回执</text></g><g data-relation="R3" role="button" tabindex="0" aria-label="已否定联系 · 范围具体化"><rect x="20" y="266" width="780" height="74" rx="8" fill="#fafafa" stroke="#777777" stroke-dasharray="5 4"/><text x="36" y="291" fill="#777777">已否定联系 · 范围具体化</text><text x="36" y="317">有效申请得到完整登记 → 有效申请得到登记，并收到有效回执</text></g><g data-relation="R4" role="button" tabindex="0" aria-label="待确认联系 · 过程先后"><rect x="20" y="354" width="780" height="74" rx="8" fill="#fafafa" stroke="#8b6725" stroke-dasharray="5 4"/><text x="36" y="379" fill="#8b6725">待确认联系 · 过程先后</text><text x="36" y="405">有效申请得到完整登记 → 有效申请得到登记，并收到有效回执</text></g></svg>