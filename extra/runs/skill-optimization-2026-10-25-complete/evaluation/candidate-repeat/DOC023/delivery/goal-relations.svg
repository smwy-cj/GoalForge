<svg xmlns="http://www.w3.org/2000/svg" width="820" height="882" viewBox="0 0 820 882" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="90" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="141">增加 LinkedIn 个人资料上的连接数量。 → 向他人展示自己在 LinkedIn 上活跃。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="178" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="203" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="229">获得目标公司现任员工的职位内推。 → 借助内推提高简历被招聘人员看到的机会。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="266" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="291" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="317">只选择同时是目标公司现任员工和自己大学校友的人作为此类内推联系人。 → 获得目标公司现任员工</text><text x="36" y="339">的职位内推。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="376" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="401" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="427">用公司名和在读大学名搜索潜在内推联系人。 → 查看潜在联系人的个人资料以判断经历是否符合需要</text><text x="36" y="449">。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="486" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="511" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="537">查看潜在联系人的个人资料以判断经历是否符合需要。 → 在对方经历匹配时发送连接邀请。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="574" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="599" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="625">在对方经历匹配时发送连接邀请。 → 连接邀请被接受后与对方聊天讨论进一步细节。</text></g><g data-relation="R007" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="662" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="687" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="713">也可通过删减或细化搜索关键词尝试获得更精确的联系人结果。 → 用公司名和在读大学名搜索潜在内</text><text x="36" y="735">推联系人。</text></g><g data-relation="R008" role="button" tabindex="0" aria-label="已否定联系 · 范围具体化"><rect x="20" y="772" width="780" height="96" rx="8" fill="#fafafa" stroke="#777777" stroke-dasharray="5 4"/><text x="36" y="797" fill="#777777">已否定联系 · 范围具体化</text><text x="36" y="823">只选择同时是目标公司现任员工和自己大学校友的人作为此类内推联系人。 → 用公司名和在读大学名</text><text x="36" y="845">搜索潜在内推联系人。</text></g></svg>