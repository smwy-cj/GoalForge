<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4146 198" width="4146" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G001" tabindex="0" role="button" aria-label="增加 LinkedIn 个人资料上的连接数量。"><title>增加 LinkedIn 个人资料上的连接数量。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">增加 LinkedIn 个人资料上的</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">连接数量。</text>
</g>
<g class="dag-node goal-node" data-goal="G002" tabindex="0" role="button" aria-label="向他人展示自己在 LinkedIn 上活跃。"><title>向他人展示自己在 LinkedIn 上活跃。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">向他人展示自己在 LinkedIn </text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">上活跃。</text>
</g>
<g class="dag-node goal-node" data-goal="G003" tabindex="0" role="button" aria-label="获得目标公司现任员工的职位内推。"><title>获得目标公司现任员工的职位内推。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">获得目标公司现任员工的职位</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">内推。</text>
</g>
<g class="dag-node goal-node" data-goal="G004" tabindex="0" role="button" aria-label="借助内推提高简历被招聘人员看到的机会。"><title>借助内推提高简历被招聘人员看到的机会。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助内推提高简历被招聘人员</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">看到的机会。</text>
</g>
<g class="dag-node goal-node" data-goal="G005" tabindex="0" role="button" aria-label="用公司名和在读大学名搜索潜在内推联系人。"><title>用公司名和在读大学名搜索潜在内推联系人。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">用公司名和在读大学名搜索潜</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">在内推联系人。</text>
</g>
<g class="dag-node goal-node" data-goal="G006" tabindex="0" role="button" aria-label="查看潜在联系人的个人资料以判断经历是否符合需要。"><title>查看潜在联系人的个人资料以判断经历是否符合需要。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">查看潜在联系人的个人资料以</text>
<text x="1525.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">判断经历是否符合需要。</text>
</g>
<g class="dag-node goal-node" data-goal="G007" tabindex="0" role="button" aria-label="在对方经历匹配时发送连接邀请。"><title>在对方经历匹配时发送连接邀请。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在对方经历匹配时发送连接邀</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">请。</text>
</g>
<g class="dag-node goal-node" data-goal="G008" tabindex="0" role="button" aria-label="通常在连接邀请附言中介绍自己。"><title>通常在连接邀请附言中介绍自己。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通常在连接邀请附言中介绍自</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">己。</text>
</g>
<g class="dag-node goal-node" data-goal="G009" tabindex="0" role="button" aria-label="可能在邀请附言中询问对方是否愿意内推该职位。"><title>可能在邀请附言中询问对方是否愿意内推该职位。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">可能在邀请附言中询问对方是</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">否愿意内推该职位。</text>
</g>
<g class="dag-node goal-node" data-goal="G010" tabindex="0" role="button" aria-label="连接邀请被接受后与对方聊天讨论进一步细节。"><title>连接邀请被接受后与对方聊天讨论进一步细节。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">连接邀请被接受后与对方聊天</text>
<text x="2621.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">讨论进一步细节。</text>
</g>
<g class="dag-node goal-node" data-goal="G011" tabindex="0" role="button" aria-label="只选择同时是目标公司现任员工和自己大学校友的人作为此类内推联系人。"><title>只选择同时是目标公司现任员工和自己大学校友的人作为此类内推联系人。</title><rect x="2778.0" y="38" width="234" height="90" rx="12"/>
<text x="2895.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">只选择同时是目标公司现任员</text>
<text x="2895.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">工和自己大学校友的人作为此</text>
<text x="2895.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">类内推联系人。</text>
</g>
<g class="dag-node goal-node" data-goal="G012" tabindex="0" role="button" aria-label="利用共同大学背景提高对方愿意内推的可能性。"><title>利用共同大学背景提高对方愿意内推的可能性。</title><rect x="3052.0" y="38" width="234" height="76" rx="12"/>
<text x="3169.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">利用共同大学背景提高对方愿</text>
<text x="3169.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">意内推的可能性。</text>
</g>
<g class="dag-node goal-node" data-goal="G013" tabindex="0" role="button" aria-label="在付费成本可接受时通过 LinkedIn Premium 访问更多潜在联系人。"><title>在付费成本可接受时通过 LinkedIn Premium 访问更多潜在联系人。</title><rect x="3326.0" y="38" width="234" height="90" rx="12"/>
<text x="3443.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">在付费成本可接受时通过 Lin</text>
<text x="3443.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">kedIn Premium 访问更多潜在</text>
<text x="3443.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">联系人。</text>
</g>
<g class="dag-node goal-node" data-goal="G014" tabindex="0" role="button" aria-label="也可通过删减或细化搜索关键词尝试获得更精确的联系人结果。"><title>也可通过删减或细化搜索关键词尝试获得更精确的联系人结果。</title><rect x="3600.0" y="38" width="234" height="90" rx="12"/>
<text x="3717.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">也可通过删减或细化搜索关键</text>
<text x="3717.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">词尝试获得更精确的联系人结</text>
<text x="3717.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">果。</text>
</g>
<g class="dag-node goal-node" data-goal="G015" tabindex="0" role="button" aria-label="在连接尚未接受的附言中更充分传达要说的内容。"><title>在连接尚未接受的附言中更充分传达要说的内容。</title><rect x="3874.0" y="38" width="234" height="76" rx="12"/>
<text x="3991.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在连接尚未接受的附言中更充</text>
<text x="3991.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">分传达要说的内容。</text>
</g>
</svg>