<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1212" viewBox="0 0 820 1212" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="90" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="141">按商品关键词查找附近或指定地点的供应商账号。 → 借助 Instagram 为情人节等场合寻找并购买合适</text><text x="36" y="163">礼物。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="200" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="225" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="251">没有具体商品打算时浏览同一商家的多种图片和产品以选择。 → 借助 Instagram 为情人节等场合寻找</text><text x="36" y="273">并购买合适礼物。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="310" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="335" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="361">查看其他人的评论来判断产品是否适合作为礼物。 → 借助 Instagram 为情人节等场合寻找并购买合适</text><text x="36" y="383">礼物。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="420" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="445" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="471">遇到可疑卖家时要求先交付再付款。 → 避免向恶意商家付款后收不到所购产品。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="508" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="533" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="559">查看产品的点赞和评论及其时间分布，辅助判断商家是否可疑。 → 避免向恶意商家付款后收不到所购</text><text x="36" y="581">产品。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="618" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="643" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="669">通过关注希望进一步了解的人保持联系。 → 即使更换或丢失电话号码，也能通过 Instagram 重新联系</text><text x="36" y="691">朋友。</text></g><g data-relation="R007" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="728" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="753" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="779">完成所需事项后通过退出登录等方式增加再次随手使用的阻力。 → 只在有具体用途时使用 Instagram</text><text x="36" y="801">，减少无意识影响及耗时。</text></g><g data-relation="R008" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="838" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="863" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="889">通过商家电话号码或 WhatsApp 询问所选产品价格。 → 确认购买后取得付款号码并支付商品款项。</text></g><g data-relation="R009" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="926" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="951" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="977">确认购买后取得付款号码并支付商品款项。 → 付款后确认产品应送达的地址。</text></g><g data-relation="R010" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="1014" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1039" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="1065">付款后确认产品应送达的地址。 → 在商家通知到达后接收所购买的产品。</text></g><g data-relation="R011" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="1102" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1127" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="1153">到新地方或短期停留时快速了解商家位置、联系方式及所售产品。 → 按商品关键词查找附近或指定地</text><text x="36" y="1175">点的供应商账号。</text></g></svg>