<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6886 198" width="6886" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G001" tabindex="0" role="button" aria-label="借助 Instagram 为情人节等场合寻找并购买合适礼物。"><title>借助 Instagram 为情人节等场合寻找并购买合适礼物。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助 Instagram 为情人节等</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">场合寻找并购买合适礼物。</text>
</g>
<g class="dag-node goal-node" data-goal="G002" tabindex="0" role="button" aria-label="先查看服装等产品设计，再在实体市场寻找喜欢的款式。"><title>先查看服装等产品设计，再在实体市场寻找喜欢的款式。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">先查看服装等产品设计，再在</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">实体市场寻找喜欢的款式。</text>
</g>
<g class="dag-node goal-node" data-goal="G003" tabindex="0" role="button" aria-label="按商品关键词查找附近或指定地点的供应商账号。"><title>按商品关键词查找附近或指定地点的供应商账号。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">按商品关键词查找附近或指定</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">地点的供应商账号。</text>
</g>
<g class="dag-node goal-node" data-goal="G004" tabindex="0" role="button" aria-label="优先使用商家资料中指定的电话或 WhatsApp 联系，以更快得到回应。"><title>优先使用商家资料中指定的电话或 WhatsApp 联系，以更快得到回应。</title><rect x="860.0" y="38" width="234" height="90" rx="12"/>
<text x="977.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">优先使用商家资料中指定的电</text>
<text x="977.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">话或 WhatsApp 联系，以更快</text>
<text x="977.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">得到回应。</text>
</g>
<g class="dag-node goal-node" data-goal="G005" tabindex="0" role="button" aria-label="避免向恶意商家付款后收不到所购产品。"><title>避免向恶意商家付款后收不到所购产品。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">避免向恶意商家付款后收不到</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">所购产品。</text>
</g>
<g class="dag-node goal-node" data-goal="G006" tabindex="0" role="button" aria-label="遇到可疑卖家时要求先交付再付款。"><title>遇到可疑卖家时要求先交付再付款。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">遇到可疑卖家时要求先交付再</text>
<text x="1525.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">付款。</text>
</g>
<g class="dag-node goal-node" data-goal="G007" tabindex="0" role="button" aria-label="没有具体商品打算时浏览同一商家的多种图片和产品以选择。"><title>没有具体商品打算时浏览同一商家的多种图片和产品以选择。</title><rect x="1682.0" y="38" width="234" height="90" rx="12"/>
<text x="1799.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">没有具体商品打算时浏览同一</text>
<text x="1799.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">商家的多种图片和产品以选择</text>
<text x="1799.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G008" tabindex="0" role="button" aria-label="无需登录即可浏览和搜索商家等内容。"><title>无需登录即可浏览和搜索商家等内容。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">无需登录即可浏览和搜索商家</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">等内容。</text>
</g>
<g class="dag-node goal-node" data-goal="G009" tabindex="0" role="button" aria-label="有时搜索商品时不让别人知道自己在线。"><title>有时搜索商品时不让别人知道自己在线。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">有时搜索商品时不让别人知道</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">自己在线。</text>
</g>
<g class="dag-node goal-node" data-goal="G010" tabindex="0" role="button" aria-label="利用保存的搜索记录快速回到曾查找的商家。"><title>利用保存的搜索记录快速回到曾查找的商家。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">利用保存的搜索记录快速回到</text>
<text x="2621.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">曾查找的商家。</text>
</g>
<g class="dag-node goal-node" data-goal="G011" tabindex="0" role="button" aria-label="查看产品的点赞和评论及其时间分布，辅助判断商家是否可疑。"><title>查看产品的点赞和评论及其时间分布，辅助判断商家是否可疑。</title><rect x="2778.0" y="38" width="234" height="90" rx="12"/>
<text x="2895.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">查看产品的点赞和评论及其时</text>
<text x="2895.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">间分布，辅助判断商家是否可</text>
<text x="2895.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">疑。</text>
</g>
<g class="dag-node goal-node" data-goal="G012" tabindex="0" role="button" aria-label="查看其他人的评论来判断产品是否适合作为礼物。"><title>查看其他人的评论来判断产品是否适合作为礼物。</title><rect x="3052.0" y="38" width="234" height="76" rx="12"/>
<text x="3169.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">查看其他人的评论来判断产品</text>
<text x="3169.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">是否适合作为礼物。</text>
</g>
<g class="dag-node goal-node" data-goal="G013" tabindex="0" role="button" aria-label="使用私密账号让发布内容仅供很亲近的朋友访问。"><title>使用私密账号让发布内容仅供很亲近的朋友访问。</title><rect x="3326.0" y="38" width="234" height="76" rx="12"/>
<text x="3443.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">使用私密账号让发布内容仅供</text>
<text x="3443.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">很亲近的朋友访问。</text>
</g>
<g class="dag-node goal-node" data-goal="G014" tabindex="0" role="button" aria-label="期望在线状态也仅对很亲近的朋友可见。"><title>期望在线状态也仅对很亲近的朋友可见。</title><rect x="3600.0" y="38" width="234" height="76" rx="12"/>
<text x="3717.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">期望在线状态也仅对很亲近的</text>
<text x="3717.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">朋友可见。</text>
</g>
<g class="dag-node goal-node" data-goal="G015" tabindex="0" role="button" aria-label="即使更换或丢失电话号码，也能通过 Instagram 重新联系朋友。"><title>即使更换或丢失电话号码，也能通过 Instagram 重新联系朋友。</title><rect x="3874.0" y="38" width="234" height="90" rx="12"/>
<text x="3991.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">即使更换或丢失电话号码，也</text>
<text x="3991.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">能通过 Instagram 重新联系</text>
<text x="3991.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">朋友。</text>
</g>
<g class="dag-node goal-node" data-goal="G016" tabindex="0" role="button" aria-label="通过关注希望进一步了解的人保持联系。"><title>通过关注希望进一步了解的人保持联系。</title><rect x="4148.0" y="38" width="234" height="76" rx="12"/>
<text x="4265.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过关注希望进一步了解的人</text>
<text x="4265.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">保持联系。</text>
</g>
<g class="dag-node goal-node" data-goal="G017" tabindex="0" role="button" aria-label="只在有具体用途时使用 Instagram，减少无意识影响及耗时。"><title>只在有具体用途时使用 Instagram，减少无意识影响及耗时。</title><rect x="4422.0" y="38" width="234" height="90" rx="12"/>
<text x="4539.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">只在有具体用途时使用 Insta</text>
<text x="4539.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">gram，减少无意识影响及耗时</text>
<text x="4539.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G018" tabindex="0" role="button" aria-label="完成所需事项后通过退出登录等方式增加再次随手使用的阻力。"><title>完成所需事项后通过退出登录等方式增加再次随手使用的阻力。</title><rect x="4696.0" y="38" width="234" height="90" rx="12"/>
<text x="4813.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">完成所需事项后通过退出登录</text>
<text x="4813.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">等方式增加再次随手使用的阻</text>
<text x="4813.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">力。</text>
</g>
<g class="dag-node goal-node" data-goal="G019" tabindex="0" role="button" aria-label="在节日购物期间暂时保持登录以便连续查看，结束后再退出。"><title>在节日购物期间暂时保持登录以便连续查看，结束后再退出。</title><rect x="4970.0" y="38" width="234" height="90" rx="12"/>
<text x="5087.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">在节日购物期间暂时保持登录</text>
<text x="5087.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">以便连续查看，结束后再退出</text>
<text x="5087.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G020" tabindex="0" role="button" aria-label="到新地方或短期停留时快速了解商家位置、联系方式及所售产品。"><title>到新地方或短期停留时快速了解商家位置、联系方式及所售产品。</title><rect x="5244.0" y="38" width="234" height="90" rx="12"/>
<text x="5361.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">到新地方或短期停留时快速了</text>
<text x="5361.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">解商家位置、联系方式及所售</text>
<text x="5361.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">产品。</text>
</g>
<g class="dag-node goal-node" data-goal="G021" tabindex="0" role="button" aria-label="希望商家在产品页面直接列出价格。"><title>希望商家在产品页面直接列出价格。</title><rect x="5518.0" y="38" width="234" height="76" rx="12"/>
<text x="5635.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望商家在产品页面直接列出</text>
<text x="5635.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">价格。</text>
</g>
<g class="dag-node goal-node" data-goal="G022" tabindex="0" role="button" aria-label="通过商家电话号码或 WhatsApp 询问所选产品价格。"><title>通过商家电话号码或 WhatsApp 询问所选产品价格。</title><rect x="5792.0" y="38" width="234" height="76" rx="12"/>
<text x="5909.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过商家电话号码或 WhatsAp</text>
<text x="5909.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">p 询问所选产品价格。</text>
</g>
<g class="dag-node goal-node" data-goal="G023" tabindex="0" role="button" aria-label="确认购买后取得付款号码并支付商品款项。"><title>确认购买后取得付款号码并支付商品款项。</title><rect x="6066.0" y="38" width="234" height="76" rx="12"/>
<text x="6183.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">确认购买后取得付款号码并支</text>
<text x="6183.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">付商品款项。</text>
</g>
<g class="dag-node goal-node" data-goal="G024" tabindex="0" role="button" aria-label="付款后确认产品应送达的地址。"><title>付款后确认产品应送达的地址。</title><rect x="6340.0" y="38" width="234" height="76" rx="12"/>
<text x="6457.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">付款后确认产品应送达的地址</text>
<text x="6457.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G025" tabindex="0" role="button" aria-label="在商家通知到达后接收所购买的产品。"><title>在商家通知到达后接收所购买的产品。</title><rect x="6614.0" y="38" width="234" height="76" rx="12"/>
<text x="6731.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在商家通知到达后接收所购买</text>
<text x="6731.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">的产品。</text>
</g>
</svg>