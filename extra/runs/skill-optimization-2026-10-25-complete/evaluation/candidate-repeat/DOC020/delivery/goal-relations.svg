<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1036" viewBox="0 0 820 1036" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="90" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="141">通常把两三句主要要点交给 AI 助手起草新邮件或回复。 → 发送已整理好的邮件。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="178" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="203" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="229">在发送前自行调整 AI 起草的邮件。 → 发送已整理好的邮件。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="266" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="291" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="317">偶尔发送多媒体时，偏好上传云端后以链接分享。 → 让接收者能方便地在手机或笔记本等平台查看所</text><text x="36" y="339">分享的多媒体。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="376" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="401" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="427">用 AI 助手提取收到邮件的主要要点。 → 借助 AI 减少逐封阅读所有邮件所花的时间。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="464" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="489" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="515">在邮件中突出显示关键词或关键提示。 → 避免重要邮件被忽略，即使因此需要接收一些垃圾邮件。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="552" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="577" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="603">可考虑定期汇总多封邮件，作为减少逐封阅读的一种方案。 → 借助 AI 减少逐封阅读所有邮件所花的</text><text x="36" y="625">时间。</text></g><g data-relation="R007" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="662" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="687" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="713">在邮件客户端内置 AI 助手，把简短问题或要点组织成邮件。 → 通常把两三句主要要点交给 AI 助手</text><text x="36" y="735">起草新邮件或回复。</text></g><g data-relation="R008" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="772" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="797" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="823">避免重要邮件被忽略，即使因此需要接收一些垃圾邮件。 → 每天检查招聘邮件以免错过招聘新信息。</text></g><g data-relation="R009" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="860" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="885" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="911">可直接编辑已发送邮件，避免另发新邮件来纠错。 → 让收件人看到已发送邮件的最新版本。</text></g><g data-relation="R010" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="948" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="973" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="999">可通过标签等搜索条件过滤邮件。 → 每天使用邮件搜索以找到所需邮件。</text></g></svg>