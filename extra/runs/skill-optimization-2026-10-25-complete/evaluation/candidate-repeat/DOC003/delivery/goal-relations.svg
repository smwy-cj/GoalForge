<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1960" viewBox="0 0 820 1960" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="90" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="141">通常争取至少提前一到一个半月订票，理想为数月前，以获得更好价格。 → 为所需行程找到合适的低</text><text x="36" y="163">价或优惠。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="200" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="225" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="251">在时间允许时跨多个网站、多个时段重复比较，以寻找更好的票价。 → 为所需行程找到合适的低价或</text><text x="36" y="273">优惠。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="310" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="335" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="361">比较多个预订供应商的最终价格、折扣及其他选项。 → 为所需行程找到合适的低价或优惠。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="398" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="423" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="449">检查适用的优惠券或折扣，以确定更优惠的实际购票选项。 → 为所需行程找到合适的低价或优惠。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="486" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="511" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="537">选择与所需地面交通及住宿安排衔接的航班时间。 → 通过旅行网站找到符合自身情况的合适行程。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="574" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="599" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="625">价差可承担时优先选择能赶上末班火车的航班以当晚到家。 → 选择与所需地面交通及住宿安排衔接的</text><text x="36" y="647">航班时间。</text></g><g data-relation="R007" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="684" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="709" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="735">探访他人时，使航班时间与对方日程匹配。 → 通过旅行网站找到符合自身情况的合适行程。</text></g><g data-relation="R008" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="772" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="797" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="823">在可选择时优先保留夜间睡眠，同时可接受红眼航班。 → 通过旅行网站找到符合自身情况的合适行程</text><text x="36" y="845">。</text></g><g data-relation="R009" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="882" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="907" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="933">转机时通常预留至少约1.5倍最低转机时间，并按延误风险倾向更宽余量。 → 通过旅行网站找到符合自</text><text x="36" y="955">身情况的合适行程。</text></g><g data-relation="R010" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="992" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1017" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="1043">必须成行且价格过高时，为几条可接受路线设置降价提醒，以便及时购票。 → 为所需行程找到合适的</text><text x="36" y="1065">低价或优惠。</text></g><g data-relation="R011" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="1102" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1127" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="1153">从国家或地区及附近机场范围搜索可行的出发地—目的地组合。 → 比较不同日期的可行航班组合。</text></g><g data-relation="R012" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="1190" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1215" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="1241">比较多个预订供应商的最终价格、折扣及其他选项。 → 最终确定行程和供应商后，在供应商页面填写</text><text x="36" y="1263">所需资料并用信用卡付款完成预订。</text></g><g data-relation="R013" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="1300" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1325" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="1351">理想情况下由一个持续更新的服务记录持有哪些卡或通行证。 → 理想情况下按实际持卡和通行证情况</text><text x="36" y="1373">获知可使用的休息室权益。</text></g><g data-relation="R014" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="1410" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1435" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="1461">现有第三方信息更新不可靠时，从发卡方或通行证官方来源查休息室资料。 → 查询具体机场航站楼休</text><text x="36" y="1483">息室的开放时间、准入政策及装修情况。</text></g><g data-relation="R015" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="1520" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1545" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="1571">同时研究更多机场、日期、旅客及舱位组合以减少重复搜索。 → 在保持研究准确和覆盖组合的同时减</text><text x="36" y="1593">少查找合适航班的时间。</text></g><g data-relation="R016" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="1630" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1655" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="1681">希望在一个地方获得做航班预订研究所需的信息。 → 在保持研究准确和覆盖组合的同时减少查找合适</text><text x="36" y="1703">航班的时间。</text></g><g data-relation="R017" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="1740" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1765" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="1791">希望能输入全部旅行参数后，由平台更便捷地找出合适选项。 → 在保持研究准确和覆盖组合的同时减</text><text x="36" y="1813">少查找合适航班的时间。</text></g><g data-relation="R018" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="1850" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="1875" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="1901">现金购票的研究阶段通常不登录并尽量匿名，除非有特定迫切需要。 → 尽量减少向额外第三方分享个</text><text x="36" y="1923">人资料。</text></g></svg>