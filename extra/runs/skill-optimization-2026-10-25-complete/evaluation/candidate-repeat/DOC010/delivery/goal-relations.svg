<svg xmlns="http://www.w3.org/2000/svg" width="820" height="794" viewBox="0 0 820 794" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="90" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="141">利用当天的天气信息决定穿什么。 → 利用天气信息规划日常和旅行安排。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="178" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="203" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="229">依据天气规划户外活动。 → 利用天气信息规划日常和旅行安排。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="266" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="291" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="317">依据目的地天气规划旅行。 → 利用天气信息规划日常和旅行安排。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="354" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="379" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="405">规划旅行和活动购票时查看整周天气。 → 依据目的地天气规划旅行。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="442" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="467" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="493">在决定游乐园等活动购票前检查天气是否适宜。 → 依据天气规划户外活动。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="530" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="555" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="581">正在下雨时更频繁收到雨势开始、停止等变化通知。 → 获取及时的实时天气更新以支持出行选择。</text></g><g data-relation="R007" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="618" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="643" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="669">获取及时的实时天气更新以支持出行选择。 → 根据短时天气信息选择步行或公交等出行方式。</text></g><g data-relation="R008" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="706" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="731" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="757">查看雷暴、洪水等极端天气信息。 → 遇到极端天气时推迟整个活动。</text></g></svg>