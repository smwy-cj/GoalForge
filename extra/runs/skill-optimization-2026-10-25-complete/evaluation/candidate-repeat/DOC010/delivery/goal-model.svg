<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6064 198" width="6064" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G001" tabindex="0" role="button" aria-label="利用天气信息规划日常和旅行安排。"><title>利用天气信息规划日常和旅行安排。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">利用天气信息规划日常和旅行</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">安排。</text>
</g>
<g class="dag-node goal-node" data-goal="G002" tabindex="0" role="button" aria-label="利用当天的天气信息决定穿什么。"><title>利用当天的天气信息决定穿什么。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">利用当天的天气信息决定穿什</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">么。</text>
</g>
<g class="dag-node goal-node" data-goal="G003" tabindex="0" role="button" aria-label="依据天气规划户外活动。"><title>依据天气规划户外活动。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">依据天气规划户外活动。</text>
</g>
<g class="dag-node goal-node" data-goal="G004" tabindex="0" role="button" aria-label="依据目的地天气规划旅行。"><title>依据目的地天气规划旅行。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">依据目的地天气规划旅行。</text>
</g>
<g class="dag-node goal-node" data-goal="G005" tabindex="0" role="button" aria-label="早晨通常通过 Siri 或 AI 助手获取天气信息。"><title>早晨通常通过 Siri 或 AI 助手获取天气信息。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">早晨通常通过 Siri 或 AI 助</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">手获取天气信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G006" tabindex="0" role="button" aria-label="助手未给出需要的信息时打开天气应用查看。"><title>助手未给出需要的信息时打开天气应用查看。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">助手未给出需要的信息时打开</text>
<text x="1525.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">天气应用查看。</text>
</g>
<g class="dag-node goal-node" data-goal="G007" tabindex="0" role="button" aria-label="根据天气决定当天随身携带什么。"><title>根据天气决定当天随身携带什么。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">根据天气决定当天随身携带什</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">么。</text>
</g>
<g class="dag-node goal-node" data-goal="G008" tabindex="0" role="button" aria-label="规划旅行和活动购票时查看整周天气。"><title>规划旅行和活动购票时查看整周天气。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">规划旅行和活动购票时查看整</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">周天气。</text>
</g>
<g class="dag-node goal-node" data-goal="G009" tabindex="0" role="button" aria-label="在决定游乐园等活动购票前检查天气是否适宜。"><title>在决定游乐园等活动购票前检查天气是否适宜。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在决定游乐园等活动购票前检</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">查天气是否适宜。</text>
</g>
<g class="dag-node goal-node" data-goal="G010" tabindex="0" role="button" aria-label="每次出门前重新查看天气。"><title>每次出门前重新查看天气。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">每次出门前重新查看天气。</text>
</g>
<g class="dag-node goal-node" data-goal="G011" tabindex="0" role="button" aria-label="到陌生地点时借助天气应用熟悉当地天气。"><title>到陌生地点时借助天气应用熟悉当地天气。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">到陌生地点时借助天气应用熟</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">悉当地天气。</text>
</g>
<g class="dag-node goal-node" data-goal="G012" tabindex="0" role="button" aria-label="查看雷暴、洪水等极端天气信息。"><title>查看雷暴、洪水等极端天气信息。</title><rect x="3052.0" y="38" width="234" height="76" rx="12"/>
<text x="3169.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">查看雷暴、洪水等极端天气信</text>
<text x="3169.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">息。</text>
</g>
<g class="dag-node goal-node" data-goal="G013" tabindex="0" role="button" aria-label="遇到极端天气时推迟整个活动。"><title>遇到极端天气时推迟整个活动。</title><rect x="3326.0" y="38" width="234" height="76" rx="12"/>
<text x="3443.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">遇到极端天气时推迟整个活动</text>
<text x="3443.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G014" tabindex="0" role="button" aria-label="在极端天气出现时收到天气应用通知或警报。"><title>在极端天气出现时收到天气应用通知或警报。</title><rect x="3600.0" y="38" width="234" height="76" rx="12"/>
<text x="3717.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在极端天气出现时收到天气应</text>
<text x="3717.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">用通知或警报。</text>
</g>
<g class="dag-node goal-node" data-goal="G015" tabindex="0" role="button" aria-label="通常在早晨、下午和晚上各收到一次天气通知以融入出门习惯。"><title>通常在早晨、下午和晚上各收到一次天气通知以融入出门习惯。</title><rect x="3874.0" y="38" width="234" height="90" rx="12"/>
<text x="3991.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">通常在早晨、下午和晚上各收</text>
<text x="3991.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">到一次天气通知以融入出门习</text>
<text x="3991.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">惯。</text>
</g>
<g class="dag-node goal-node" data-goal="G016" tabindex="0" role="button" aria-label="正在下雨时更频繁收到雨势开始、停止等变化通知。"><title>正在下雨时更频繁收到雨势开始、停止等变化通知。</title><rect x="4148.0" y="38" width="234" height="76" rx="12"/>
<text x="4265.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">正在下雨时更频繁收到雨势开</text>
<text x="4265.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">始、停止等变化通知。</text>
</g>
<g class="dag-node goal-node" data-goal="G017" tabindex="0" role="button" aria-label="获取及时的实时天气更新以支持出行选择。"><title>获取及时的实时天气更新以支持出行选择。</title><rect x="4422.0" y="38" width="234" height="76" rx="12"/>
<text x="4539.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">获取及时的实时天气更新以支</text>
<text x="4539.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">持出行选择。</text>
</g>
<g class="dag-node goal-node" data-goal="G018" tabindex="0" role="button" aria-label="根据短时天气信息选择步行或公交等出行方式。"><title>根据短时天气信息选择步行或公交等出行方式。</title><rect x="4696.0" y="38" width="234" height="76" rx="12"/>
<text x="4813.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">根据短时天气信息选择步行或</text>
<text x="4813.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">公交等出行方式。</text>
</g>
<g class="dag-node goal-node" data-goal="G019" tabindex="0" role="button" aria-label="避免天气应用显示未及时更新的降雨状态。"><title>避免天气应用显示未及时更新的降雨状态。</title><rect x="4970.0" y="38" width="234" height="76" rx="12"/>
<text x="5087.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">避免天气应用显示未及时更新</text>
<text x="5087.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">的降雨状态。</text>
</g>
<g class="dag-node goal-node" data-goal="G020" tabindex="0" role="button" aria-label="偏好没有广告的天气应用体验。"><title>偏好没有广告的天气应用体验。</title><rect x="5244.0" y="38" width="234" height="76" rx="12"/>
<text x="5361.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">偏好没有广告的天气应用体验</text>
<text x="5361.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G021" tabindex="0" role="button" aria-label="保持不同平台上的天气信息一致。"><title>保持不同平台上的天气信息一致。</title><rect x="5518.0" y="38" width="234" height="76" rx="12"/>
<text x="5635.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">保持不同平台上的天气信息一</text>
<text x="5635.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">致。</text>
</g>
<g class="dag-node goal-node" data-goal="G022" tabindex="0" role="button" aria-label="遇到雷暴、洪水等极端天气时不外出。"><title>遇到雷暴、洪水等极端天气时不外出。</title><rect x="5792.0" y="38" width="234" height="76" rx="12"/>
<text x="5909.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">遇到雷暴、洪水等极端天气时</text>
<text x="5909.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">不外出。</text>
</g>
</svg>