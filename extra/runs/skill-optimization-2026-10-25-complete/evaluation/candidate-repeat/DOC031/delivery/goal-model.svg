<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3598 198" width="3598" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G001" tabindex="0" role="button" aria-label="通过 Slack 与大学同学、助教及教授即时沟通。"><title>通过 Slack 与大学同学、助教及教授即时沟通。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过 Slack 与大学同学、助</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">教及教授即时沟通。</text>
</g>
<g class="dag-node goal-node" data-goal="G002" tabindex="0" role="button" aria-label="仅凭姓名或姓氏找到校内联系人，无需事先保存号码或邮箱。"><title>仅凭姓名或姓氏找到校内联系人，无需事先保存号码或邮箱。</title><rect x="312.0" y="38" width="234" height="90" rx="12"/>
<text x="429.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">仅凭姓名或姓氏找到校内联系</text>
<text x="429.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">人，无需事先保存号码或邮箱</text>
<text x="429.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G003" tabindex="0" role="button" aria-label="在手机或已打开的笔记本上联系校内人员。"><title>在手机或已打开的笔记本上联系校内人员。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在手机或已打开的笔记本上联</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">系校内人员。</text>
</g>
<g class="dag-node goal-node" data-goal="G004" tabindex="0" role="button" aria-label="借助频道即时向广泛受众传达信息。"><title>借助频道即时向广泛受众传达信息。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助频道即时向广泛受众传达</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G005" tabindex="0" role="button" aria-label="加入频道后仍可查阅加入前的频道信息。"><title>加入频道后仍可查阅加入前的频道信息。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">加入频道后仍可查阅加入前的</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">频道信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G006" tabindex="0" role="button" aria-label="从频道了解课程、项目、院系和校园的动态。"><title>从频道了解课程、项目、院系和校园的动态。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">从频道了解课程、项目、院系</text>
<text x="1525.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">和校园的动态。</text>
</g>
<g class="dag-node goal-node" data-goal="G007" tabindex="0" role="button" aria-label="协作时通过私信即时向队友共享文档。"><title>协作时通过私信即时向队友共享文档。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">协作时通过私信即时向队友共</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">享文档。</text>
</g>
<g class="dag-node goal-node" data-goal="G008" tabindex="0" role="button" aria-label="通过关键词找到所需的过往消息或学习信息。"><title>通过关键词找到所需的过往消息或学习信息。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过关键词找到所需的过往消</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">息或学习信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G009" tabindex="0" role="button" aria-label="在信息量大的搜索结果中更容易找到所需消息。"><title>在信息量大的搜索结果中更容易找到所需消息。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在信息量大的搜索结果中更容</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">易找到所需消息。</text>
</g>
<g class="dag-node goal-node" data-goal="G010" tabindex="0" role="button" aria-label="让 Slack 的音频和视频通话更容易访问，尤其在群组场景。"><title>让 Slack 的音频和视频通话更容易访问，尤其在群组场景。</title><rect x="2504.0" y="38" width="234" height="90" rx="12"/>
<text x="2621.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">让 Slack 的音频和视频通话</text>
<text x="2621.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">更容易访问，尤其在群组场景</text>
<text x="2621.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G011" tabindex="0" role="button" aria-label="已熟悉对方并持有其电话号码时，直接拨电话以更快联系。"><title>已熟悉对方并持有其电话号码时，直接拨电话以更快联系。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">已熟悉对方并持有其电话号码</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">时，直接拨电话以更快联系。</text>
</g>
<g class="dag-node goal-node" data-goal="G012" tabindex="0" role="button" aria-label="需要正式联系助教或教授时，从 Slack 快速跳转到常用邮件应用发送邮件。"><title>需要正式联系助教或教授时，从 Slack 快速跳转到常用邮件应用发送邮件。</title><rect x="3052.0" y="38" width="234" height="90" rx="12"/>
<text x="3169.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">需要正式联系助教或教授时，</text>
<text x="3169.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">从 Slack 快速跳转到常用邮</text>
<text x="3169.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">件应用发送邮件。</text>
</g>
<g class="dag-node goal-node" data-goal="G013" tabindex="0" role="button" aria-label="考虑改善浏览器窗口缩窄并排显示时的 Slack 导航。"><title>考虑改善浏览器窗口缩窄并排显示时的 Slack 导航。</title><rect x="3326.0" y="38" width="234" height="76" rx="12"/>
<text x="3443.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">考虑改善浏览器窗口缩窄并排</text>
<text x="3443.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">显示时的 Slack 导航。</text>
</g>
</svg>