<svg xmlns="http://www.w3.org/2000/svg" width="820" height="684" viewBox="0 0 820 684" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="90" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="141">仅凭姓名或姓氏找到校内联系人，无需事先保存号码或邮箱。 → 通过 Slack 与大学同学、助教及教授</text><text x="36" y="163">即时沟通。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="200" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="225" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="251">协作时通过私信即时向队友共享文档。 → 通过 Slack 与大学同学、助教及教授即时沟通。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="288" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="313" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="339">借助频道即时向广泛受众传达信息。 → 通过 Slack 与大学同学、助教及教授即时沟通。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="376" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="401" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="427">加入频道后仍可查阅加入前的频道信息。 → 从频道了解课程、项目、院系和校园的动态。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="464" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="489" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="515">需要正式联系助教或教授时，从 Slack 快速跳转到常用邮件应用发送邮件。 → 通过 Slack 与大学同</text><text x="36" y="537">学、助教及教授即时沟通。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 过程先后"><rect x="20" y="574" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="599" fill="#296a75">有依据的联系 · 过程先后</text><text x="36" y="625">仅凭姓名或姓氏找到校内联系人，无需事先保存号码或邮箱。 → 协作时通过私信即时向队友共享文档</text><text x="36" y="647">。</text></g></svg>