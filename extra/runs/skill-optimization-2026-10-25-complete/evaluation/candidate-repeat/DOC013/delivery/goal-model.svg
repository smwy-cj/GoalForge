<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6612 198" width="6612" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G001" tabindex="0" role="button" aria-label="限制部分观众访问不适合他们的内容。"><title>限制部分观众访问不适合他们的内容。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">限制部分观众访问不适合他们</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">的内容。</text>
</g>
<g class="dag-node goal-node" data-goal="G002" tabindex="0" role="button" aria-label="阻止创作者向任何人分享被禁止的内容。"><title>阻止创作者向任何人分享被禁止的内容。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">阻止创作者向任何人分享被禁</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">止的内容。</text>
</g>
<g class="dag-node goal-node" data-goal="G003" tabindex="0" role="button" aria-label="作为观众通过文本或过滤条件搜索特定类型的视频内容。"><title>作为观众通过文本或过滤条件搜索特定类型的视频内容。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">作为观众通过文本或过滤条件</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">搜索特定类型的视频内容。</text>
</g>
<g class="dag-node goal-node" data-goal="G004" tabindex="0" role="button" aria-label="作为观众通过带缩略图及描述等信息的多个选项直观浏览视频。"><title>作为观众通过带缩略图及描述等信息的多个选项直观浏览视频。</title><rect x="860.0" y="38" width="234" height="90" rx="12"/>
<text x="977.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">作为观众通过带缩略图及描述</text>
<text x="977.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">等信息的多个选项直观浏览视</text>
<text x="977.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">频。</text>
</g>
<g class="dag-node goal-node" data-goal="G005" tabindex="0" role="button" aria-label="作为创作者上传视频。"><title>作为创作者上传视频。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">作为创作者上传视频。</text>
</g>
<g class="dag-node goal-node" data-goal="G006" tabindex="0" role="button" aria-label="作为创作者开始直播。"><title>作为创作者开始直播。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">作为创作者开始直播。</text>
</g>
<g class="dag-node goal-node" data-goal="G007" tabindex="0" role="button" aria-label="为创作者上传的视频添加描述。"><title>为创作者上传的视频添加描述。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">为创作者上传的视频添加描述</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G008" tabindex="0" role="button" aria-label="可为创作者上传的视频添加转写或字幕。"><title>可为创作者上传的视频添加转写或字幕。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">可为创作者上传的视频添加转</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">写或字幕。</text>
</g>
<g class="dag-node goal-node" data-goal="G009" tabindex="0" role="button" aria-label="可在视频编辑中添加音效。"><title>可在视频编辑中添加音效。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">可在视频编辑中添加音效。</text>
</g>
<g class="dag-node goal-node" data-goal="G010" tabindex="0" role="button" aria-label="可在视频编辑中裁剪时长。"><title>可在视频编辑中裁剪时长。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">可在视频编辑中裁剪时长。</text>
</g>
<g class="dag-node goal-node" data-goal="G011" tabindex="0" role="button" aria-label="可在视频编辑中裁剪画面范围。"><title>可在视频编辑中裁剪画面范围。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">可在视频编辑中裁剪画面范围</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G012" tabindex="0" role="button" aria-label="即使用含糊的搜索条件也能获得有意义的内容结果。"><title>即使用含糊的搜索条件也能获得有意义的内容结果。</title><rect x="3052.0" y="38" width="234" height="76" rx="12"/>
<text x="3169.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">即使用含糊的搜索条件也能获</text>
<text x="3169.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">得有意义的内容结果。</text>
</g>
<g class="dag-node goal-node" data-goal="G013" tabindex="0" role="button" aria-label="观看内容时保持连续、流畅的缓冲播放，避免持续卡顿。"><title>观看内容时保持连续、流畅的缓冲播放，避免持续卡顿。</title><rect x="3326.0" y="38" width="234" height="76" rx="12"/>
<text x="3443.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">观看内容时保持连续、流畅的</text>
<text x="3443.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">缓冲播放，避免持续卡顿。</text>
</g>
<g class="dag-node goal-node" data-goal="G014" tabindex="0" role="button" aria-label="通过观看视频获得娱乐。"><title>通过观看视频获得娱乐。</title><rect x="3600.0" y="38" width="234" height="76" rx="12"/>
<text x="3717.0" y="81.0" text-anchor="middle" font-size="15" fill="#203d38">通过观看视频获得娱乐。</text>
</g>
<g class="dag-node goal-node" data-goal="G015" tabindex="0" role="button" aria-label="通过观看视频获取教育性信息。"><title>通过观看视频获取教育性信息。</title><rect x="3874.0" y="38" width="234" height="76" rx="12"/>
<text x="3991.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过观看视频获取教育性信息</text>
<text x="3991.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G016" tabindex="0" role="button" aria-label="通过快速视频搜索获取所需信息。"><title>通过快速视频搜索获取所需信息。</title><rect x="4148.0" y="38" width="234" height="76" rx="12"/>
<text x="4265.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过快速视频搜索获取所需信</text>
<text x="4265.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">息。</text>
</g>
<g class="dag-node goal-node" data-goal="G017" tabindex="0" role="button" aria-label="希望已有视频的格式能兼容上传系统。"><title>希望已有视频的格式能兼容上传系统。</title><rect x="4422.0" y="38" width="234" height="76" rx="12"/>
<text x="4539.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望已有视频的格式能兼容上</text>
<text x="4539.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">传系统。</text>
</g>
<g class="dag-node goal-node" data-goal="G018" tabindex="0" role="button" aria-label="希望上传已有视频时不受妨碍上传的长度要求限制。"><title>希望上传已有视频时不受妨碍上传的长度要求限制。</title><rect x="4696.0" y="38" width="234" height="76" rx="12"/>
<text x="4813.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望上传已有视频时不受妨碍</text>
<text x="4813.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">上传的长度要求限制。</text>
</g>
<g class="dag-node goal-node" data-goal="G019" tabindex="0" role="button" aria-label="使已上传视频发布到网上的过程简便。"><title>使已上传视频发布到网上的过程简便。</title><rect x="4970.0" y="38" width="234" height="76" rx="12"/>
<text x="5087.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">使已上传视频发布到网上的过</text>
<text x="5087.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">程简便。</text>
</g>
<g class="dag-node goal-node" data-goal="G020" tabindex="0" role="button" aria-label="作为观众可把内容加入待看列表。"><title>作为观众可把内容加入待看列表。</title><rect x="5244.0" y="38" width="234" height="76" rx="12"/>
<text x="5361.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">作为观众可把内容加入待看列</text>
<text x="5361.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">表。</text>
</g>
<g class="dag-node goal-node" data-goal="G021" tabindex="0" role="button" aria-label="作为观众可关注或订阅创作者以访问其最新内容。"><title>作为观众可关注或订阅创作者以访问其最新内容。</title><rect x="5518.0" y="38" width="234" height="76" rx="12"/>
<text x="5635.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">作为观众可关注或订阅创作者</text>
<text x="5635.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">以访问其最新内容。</text>
</g>
<g class="dag-node goal-node" data-goal="G022" tabindex="0" role="button" aria-label="考虑让不熟悉界面的观众更容易发现并理解播放控制。"><title>考虑让不熟悉界面的观众更容易发现并理解播放控制。</title><rect x="5792.0" y="38" width="234" height="76" rx="12"/>
<text x="5909.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">考虑让不熟悉界面的观众更容</text>
<text x="5909.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">易发现并理解播放控制。</text>
</g>
<g class="dag-node goal-node" data-goal="G023" tabindex="0" role="button" aria-label="考虑改善自动字幕对非英语母语观众的准确性。"><title>考虑改善自动字幕对非英语母语观众的准确性。</title><rect x="6066.0" y="38" width="234" height="76" rx="12"/>
<text x="6183.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">考虑改善自动字幕对非英语母</text>
<text x="6183.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">语观众的准确性。</text>
</g>
<g class="dag-node goal-node" data-goal="G024" tabindex="0" role="button" aria-label="可考虑为色盲观众调整播放界面颜色。"><title>可考虑为色盲观众调整播放界面颜色。</title><rect x="6340.0" y="38" width="234" height="76" rx="12"/>
<text x="6457.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">可考虑为色盲观众调整播放界</text>
<text x="6457.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">面颜色。</text>
</g>
</svg>