<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" role="group" aria-label="目标联系，不表示充分精化"><style>text{font:15px system-ui,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="32">目标之间的联系</text><text x="20" y="60">独立于成立精化；箭头按联系类型解释，状态逐项标明。</text><g data-relation="R001" role="button" tabindex="0" aria-label="有依据的联系 · 范围具体化"><rect x="20" y="90" width="780" height="96" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="115" fill="#296a75">有依据的联系 · 范围具体化</text><text x="36" y="141">即使用含糊的搜索条件也能获得有意义的内容结果。 → 作为观众通过文本或过滤条件搜索特定类型的</text><text x="36" y="163">视频内容。</text></g><g data-relation="R002" role="button" tabindex="0" aria-label="有依据的联系 · 实现方式"><rect x="20" y="200" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="225" fill="#296a75">有依据的联系 · 实现方式</text><text x="36" y="251">作为观众通过文本或过滤条件搜索特定类型的视频内容。 → 通过快速视频搜索获取所需信息。</text></g><g data-relation="R003" role="button" tabindex="0" aria-label="待确认联系 · 有助于"><rect x="20" y="288" width="780" height="74" rx="8" fill="#fafafa" stroke="#8b6725" stroke-dasharray="5 4"/><text x="36" y="313" fill="#8b6725">待确认联系 · 有助于</text><text x="36" y="339">作为观众通过带缩略图及描述等信息的多个选项直观浏览视频。 → 通过观看视频获得娱乐。</text></g><g data-relation="R004" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="376" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="401" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="427">希望已有视频的格式能兼容上传系统。 → 作为创作者上传视频。</text></g><g data-relation="R005" role="button" tabindex="0" aria-label="待确认联系 · 过程先后"><rect x="20" y="464" width="780" height="74" rx="8" fill="#fafafa" stroke="#8b6725" stroke-dasharray="5 4"/><text x="36" y="489" fill="#8b6725">待确认联系 · 过程先后</text><text x="36" y="515">作为创作者上传视频。 → 使已上传视频发布到网上的过程简便。</text></g><g data-relation="R006" role="button" tabindex="0" aria-label="有依据的联系 · 有助于"><rect x="20" y="552" width="780" height="74" rx="8" fill="#fafafa" stroke="#296a75" stroke-dasharray="5 4"/><text x="36" y="577" fill="#296a75">有依据的联系 · 有助于</text><text x="36" y="603">观看内容时保持连续、流畅的缓冲播放，避免持续卡顿。 → 通过快速视频搜索获取所需信息。</text></g></svg>