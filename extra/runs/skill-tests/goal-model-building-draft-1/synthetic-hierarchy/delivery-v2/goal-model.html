<style>
*{box-sizing:border-box}body{margin:0;color:#213349;background:#f5f7fb;font:15px/1.6 Arial,'Microsoft YaHei',sans-serif}header{padding:24px 32px 18px;background:white;border-bottom:1px solid #dae1eb}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px}p{overflow-wrap:anywhere}.eyebrow{font-size:12px;color:#157681;letter-spacing:2px}.muted{color:#63738a;font-size:13px}.badge{display:inline-block;padding:3px 10px;border-radius:20px;background:#fff1d5;color:#76500e;margin:0 6px 5px 0;font-size:12px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 32px;background:#fff}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:7px 10px;background:white;color:#213349}input[type=search]{width:245px}input[type=checkbox]{accent-color:#087f8c}button{cursor:pointer}button:hover,button:focus-visible{border-color:#087f8c;background:#ecf8f8}label{font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:74vh;min-height:550px}.canvas{position:relative;overflow:hidden;touch-action:none;border:1px solid #dae1eb;margin:0 0 0 20px;background:#f5f7fb}.canvas svg{width:100%;height:100%;display:block}.controls{position:absolute;z-index:1;top:12px;left:12px;display:flex;gap:5px}.counter{position:absolute;bottom:10px;left:14px;padding:4px 9px;background:#ffffffec;font-size:12px;border-radius:5px;pointer-events:none}aside{background:white;padding:0 22px 24px;overflow:auto;border:1px solid #dae1eb}.quote{border-left:3px solid #8fb7c0;padding:10px 13px;background:#f4f8fa;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:#67758a}.item{display:block;width:100%;text-align:left;font-size:13px;margin:6px 0;white-space:normal}.warning{background:#fff8e9;border:1px solid #e9d9b1;padding:10px;border-radius:6px;font-size:13px}details{margin:12px 0;border-top:1px solid #e0e6ef;padding-top:10px}summary{cursor:pointer}footer{padding:18px 32px;font-size:12px;overflow-wrap:anywhere}.hidden{display:none}.focused-edge path:not([style]){stroke:#087f8c;stroke-width:4}@media(max-width:950px){.workspace{grid-template-columns:1fr;height:auto}.canvas{height:65vh;margin:0 12px}aside{margin:12px;max-height:65vh}header,.toolbar{padding-left:18px;padding-right:18px}}

<header><div class="eyebrow">GOALFORGE · OFFLINE MODEL</div><h1 id="title">目标模型</h1><div id="status"></div><div class="muted" id="subtitle"></div></header>
<div class="toolbar"><input id="search" type="search" aria-label="搜索目标" placeholder="搜索目标编号或内容"><select id="origin" aria-label="目标来源"><option value="all">全部来源</option><option value="explicit">显式目标</option><option value="inferred">推断目标</option><option value="design_extension">设计扩展</option></select><label><input id="pending" type="checkbox">只看待审核</label><label><input id="related" type="checkbox">显示相关关系</label><label><input id="neighbors" type="checkbox">只看所选目标及相邻目标</label><button id="reset">恢复全部 / 重置布局</button></div>
<main class="workspace"><section class="canvas" id="canvas" aria-label="交互目标图"><div class="controls"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><button id="fit">适应画布</button></div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 690" role="img" aria-label="目标模型图" data-height="690">

<style>text{font-family:Arial,"Microsoft YaHei",sans-serif}.edge{cursor:pointer}.edge path{fill:none;stroke:#546881;stroke-width:2}.edge.related path{stroke:#8193ac;stroke-dasharray:4 6}.edge.conditional path{stroke-dasharray:10 5}.node{cursor:pointer}.node rect{fill:#fff;stroke:#455e7c;stroke-width:1.5}.node.inferred rect{fill:#fff8e6;stroke:#ad7c1b;stroke-dasharray:5 3}.node:focus rect{stroke:#18768b;stroke-width:4}.hidden{display:none}.selected rect{stroke:#087f8c;stroke-width:4}</style>
<rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="50" y="40" font-size="22" fill="#182c42">合成层级示例 · v0.1</text>

<text x="50" y="96" font-size="12" fill="#536277">显式目标白底；推断目标浅黄虚线框。节点总数 3，不确定判断见决策列表。</text>

</svg><div class="counter" id="counter"></div></section><aside><section id="detail"><h2>选择一个目标</h2><p>点击目标查看表述、原文证据与审核状态；点击连线查看关系判断。拖动空白处可平移，滚轮可缩放。</p></section><div id="limits" class="warning"></div><details open><summary>未决问题</summary><div id="issues"></div></details><details><summary>全部关系判断（含不确定与无关系）</summary><div id="decisions"></div></details><details><summary>目标列表</summary><div id="goalList"></div></details></aside></main><footer id="footer"></footer>
<script id="model-data" type="application/json">{"schema_version": "goalforge-model-draft-1", "model_id": "合成层级示例", "version": "v0.1", "parent_version": null, "input_artifacts": [], "document_scope": {"document_ids": ["SYN"], "cross_document_allowed": false}, "goals": [{"goal_id": "G1", "statement": "根据天气合理安排活动", "origin": "explicit", "actor": "用户", "context": [], "evidence_ids": ["E1"], "source_candidate_ids": ["C1"], "trace_status": "direct", "review_status": "pending"}, {"goal_id": "G2", "statement": "根据降雨安排户外活动", "origin": "explicit", "actor": "用户", "context": [], "evidence_ids": ["E2"], "source_candidate_ids": ["C2"], "trace_status": "direct", "review_status": "pending"}, {"goal_id": "G3", "statement": "减少搜索费用", "origin": "inferred", "actor": "用户", "context": [], "evidence_ids": ["E3"], "source_candidate_ids": ["C3"], "trace_status": "inferred", "review_status": "pending"}], "pair_decisions": [{"pair_id": "P12", "a": "G1", "b": "G2", "label": "refinement", "parent_id": "G1", "child_id": "G2", "rationale": "合成示例：户外活动为范围具体化。", "interpretation": "scope_specialization", "evidence_ids": ["E1", "E2"], "conditions": []}, {"pair_id": "P13", "a": "G1", "b": "G3", "label": "none", "rationale": "材料未建立联系。", "evidence_ids": [], "conditions": []}, {"pair_id": "P23", "a": "G2", "b": "G3", "label": "uncertain", "rationale": "需用户确认。", "evidence_ids": [], "conditions": []}], "edges": [{"edge_id": "R1", "type": "refinement", "parent_id": "G1", "child_id": "G2", "decision_id": "P12", "conditions": []}], "evidence_index": [{"evidence_id": "E1", "source_id": "S1", "quote": "根据天气合理安排活动", "original_locator": {"paragraph": 1}, "location_status": "exact", "recognition_status": "native_text"}, {"evidence_id": "E2", "source_id": "S2", "quote": "根据降雨安排户外活动", "original_locator": {"paragraph": 2}, "location_status": "exact", "recognition_status": "native_text"}, {"evidence_id": "E3", "source_id": "S3", "quote": "减少搜索费用", "original_locator": {"paragraph": 3}, "location_status": "exact", "recognition_status": "native_text"}], "candidate_goal_mapping": [], "diagnostics": [], "relation_coverage": {"strategy": "all_pairs", "expected_pairs": 3, "evaluated_pairs": 3}, "issues": [{"code": "uncertain", "reason": "需审核G2与G3关系。", "target_ids": ["G2", "G3"], "severity": "needs_review"}], "assumptions": [], "validation": {"structure_status": "not_run", "semantic_status": "not_run", "report_path": null}, "review": {"status": "pending", "records": []}, "changes": [], "delivery": {"mode": "assemble", "readiness": "unchecked", "limitations": ["合成例，不代表实际提取效果。"], "files": ["goal-model.json", "goal-model.md", "goal-model.html", "goal-model.svg", "delivery-manifest.json"]}, "content_sha256": "4f03b39826f93633923cb22317040b69a0f1b126ab67391724a6fdaff65cf22b"}</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('model-data').textContent);
const $=id=>document.getElementById(id),svg=$('canvas').querySelector('svg'),goals=new Map(model.goals.map(g=>[g.goal_id,g])),evidence=new Map(model.evidence_index.map(e=>[e.evidence_id,e]));
svg.setAttribute('role','group');
const labels={explicit:'显式',inferred:'推断',design_extension:'设计扩展',pending:'待人工审核',accepted:'已人工采纳',partial:'部分审核',rejected:'未采纳',unchecked:'未检查草案',blocked:'存在阻断问题',reviewable:'可供审核',not_run:'尚未执行',passed:'通过',failed:'未通过',direct:'直接支持',insufficient:'支持不足',contradicted:'存在反证',needs_retrace:'需重新追溯',related:'相关',refinement:'精化',none:'未建立关系',uncertain:'不确定',equivalent:'等价待归并'};
const label=v=>labels[v]||v, ends=e=>e.type==='refinement'?[e.parent_id,e.child_id]:[e.a,e.b];
let selected=null,view=[0,0,1140,Number(svg.dataset.height)],drag=null;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function add(parent,tag,text,cls){const x=el(tag,text,cls);parent.appendChild(x);return x}
function line(parent,name,value){add(parent,'p',name+'：'+value)}
function badges(){for(const t of ['交付：'+label(model.delivery.readiness),'结构：'+label(model.validation.structure_status),'语义：'+label(model.validation.semantic_status),'人工：'+label(model.review.status)])add($('status'),'span',t,'badge')}
$('title').textContent=model.model_id+' · '+model.version;badges();$('subtitle').textContent='只读查看 · 离线可用 · 图形布局不改变模型语义';$('limits').textContent=model.delivery.limitations.join('；')||'模型仍需按其审核状态使用。';$('footer').textContent='内容标识：'+model.content_sha256+' · JSON、Markdown、HTML、SVG 来自同一模型。';
function showEvidence(parent,ids){for(const id of ids){const e=evidence.get(id);if(!e)continue;add(parent,'h3',id+' · '+e.source_id);add(parent,'div',e.quote,'quote');line(parent,'原件位置',JSON.stringify(e.original_locator||{}));line(parent,'引文定位',e.location_status||'未记录');line(parent,'识别状态',e.recognition_status||'未知')}}
function showGoal(id){selected=id;const g=goals.get(id),box=$('detail');box.replaceChildren();add(box,'h2',g.statement);line(box,'目标编号',g.goal_id);line(box,'来源',label(g.origin));line(box,'证据支持',label(g.trace_status));line(box,'人工审核',label(g.review_status));line(box,'情境',g.context.join('；')||'无额外说明');for(const a of model.assumptions||[]){if(g.source_candidate_ids.includes(a.candidate_id)){line(box,'推断理由',a.reason);line(box,'推断假设',(a.assumptions||[]).join('；'))}}showEvidence(box,g.evidence_ids);applyFilters()}
function showDecision(p){const box=$('detail');box.replaceChildren();add(box,'h2','关系：'+label(p.label));line(box,'端点',p.a+' / '+p.b);if(p.parent_id)line(box,'精化方向',p.parent_id+' → '+p.child_id);line(box,'判断理由',p.rationale);line(box,'条件',(p.conditions||[]).join('；')||'无额外条件');line(box,'人工审核',label(p.review_status||'pending'));showEvidence(box,p.evidence_ids||[])}
function applyFilters(){const q=$('search').value.trim().toLowerCase(),origin=$('origin').value,near=new Set([selected]);if(selected)for(const e of model.edges){const [a,b]=ends(e);if(a===selected||b===selected){near.add(a);near.add(b)}}const visible=new Set();for(const g of model.goals){const show=(!q||(g.goal_id+' '+g.statement).toLowerCase().includes(q))&&(origin==='all'||g.origin===origin)&&(!$('pending').checked||g.review_status==='pending')&&(!$('neighbors').checked||!selected||near.has(g.goal_id));if(show)visible.add(g.goal_id)}for(const node of svg.querySelectorAll('[data-node]')){node.classList.toggle('hidden',!visible.has(node.dataset.node));node.classList.toggle('selected',node.dataset.node===selected)}let edgeCount=0;for(const edge of svg.querySelectorAll('[data-edge]')){const show=visible.has(edge.dataset.a)&&visible.has(edge.dataset.b)&&(!edge.classList.contains('related')||$('related').checked);edge.classList.toggle('hidden',!show);if(show)edgeCount++}$('counter').textContent='显示 '+visible.size+' / '+model.goals.length+' 个目标，'+edgeCount+' / '+model.edges.length+' 条边；不确定判断见右侧列表。'}
for(const node of svg.querySelectorAll('[data-node]')){const act=()=>showGoal(node.dataset.node);node.addEventListener('click',act);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})}
for(const node of svg.querySelectorAll('[data-edge]')){const act=()=>{const edge=model.edges.find(e=>e.edge_id===node.dataset.edge);showDecision(model.pair_decisions.find(p=>p.pair_id===edge.decision_id))};node.addEventListener('click',act);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})}
for(const g of model.goals){const b=add($('goalList'),'button',g.goal_id+' · '+g.statement,'item');b.addEventListener('click',()=>{ $('search').value='';$('origin').value='all';showGoal(g.goal_id)})}
for(const p of model.pair_decisions){const b=add($('decisions'),'button',label(p.label)+' · '+p.a+' / '+p.b,'item');b.addEventListener('click',()=>showDecision(p))}
if(!model.issues.length)add($('issues'),'p','未另列问题；不代表已通过人工审核。');
for(const issue of model.issues){const b=add($('issues'),'button',issue.reason||issue.code,'item');b.addEventListener('click',()=>{if(issue.target_ids?.length&&goals.has(issue.target_ids[0])){for(const id of ['search'])$(id).value='';$('origin').value='all';$('pending').checked=false;$('neighbors').checked=false;showGoal(issue.target_ids[0])}})}
function paint(){svg.setAttribute('viewBox',view.join(' '))}
function zoom(factor){const nw=view[2]*factor,nh=view[3]*factor;if(nw<180||nw>16000)return;view=[view[0]+(view[2]-nw)/2,view[1]+(view[3]-nh)/2,nw,nh];paint()}
$('zoomIn').onclick=()=>zoom(.8);$('zoomOut').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view=[0,0,1140,Number(svg.dataset.height)];paint()};$('reset').onclick=()=>{$('search').value='';$('origin').value='all';for(const id of ['pending','related','neighbors'])$(id).checked=false;selected=null;$('fit').click();applyFilters()};
for(const id of ['search','origin','pending','related','neighbors'])$(id).addEventListener('input',applyFilters);
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-node],[data-edge]'))return;drag={x:e.clientX,y:e.clientY,view:[...view]};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const ratio=Math.max(drag.view[2]/svg.clientWidth,drag.view[3]/svg.clientHeight);view=[drag.view[0]-(e.clientX-drag.x)*ratio,drag.view[1]-(e.clientY-drag.y)*ratio,drag.view[2],drag.view[3]];paint()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);applyFilters();
</script></body></html>
