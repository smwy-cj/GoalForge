<g class="node explicit" data-node="DOC007-G001" tabindex="0" role="button" aria-label="在忙碌周或只需补常规库存时，用线上采购替代去实体店，以节省时间。">
<rect x="50" y="160" width="310" height="124" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC007-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">在忙碌周或只需补常规库存</text>
<text x="68" y="235" fill="#182c42" font-size="16">时，用线上采购替代去实体</text>
<text x="68" y="257" fill="#182c42" font-size="16">店，以节省时间。</text>
</g>
<g class="node explicit" data-node="DOC007-G002" tabindex="0" role="button" aria-label="采购时直接按已知商品搜索并加购，不在线上浏览探索；探索留到实体店进行。">
<rect x="415" y="160" width="310" height="124" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC007-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">采购时直接按已知商品搜索</text>
<text x="433" y="235" fill="#182c42" font-size="16">并加购，不在线上浏览探索</text>
<text x="433" y="257" fill="#182c42" font-size="16">；探索留到实体店进行。</text>
</g>
<g class="node explicit" data-node="DOC007-G003" tabindex="0" role="button" aria-label="让每次采购更省力且不漏项：点开一份清单逐项核对即可，不必每次重新构建清单，也不会因漏买而再跑一趟实体店。">
<rect x="780" y="160" width="310" height="168" rx="12"/>
<text x="798" y="186" fill="#63738a" font-size="12">DOC007-G003</text>
<text x="798" y="213" fill="#182c42" font-size="16">让每次采购更省力且不漏项</text>
<text x="798" y="235" fill="#182c42" font-size="16">：点开一份清单逐项核对即</text>
<text x="798" y="257" fill="#182c42" font-size="16">可，不必每次重新构建清单</text>
<text x="798" y="279" fill="#182c42" font-size="16">，也不会因漏买而再跑一趟</text>
<text x="798" y="301" fill="#182c42" font-size="16">实体店。</text>
</g>
<g class="node explicit" data-node="DOC007-G004" tabindex="0" role="button" aria-label="由应用根据我的历史订单自动生成一份购物清单。">
<rect x="50" y="428" width="310" height="110" rx="12"/>
<text x="68" y="454" fill="#63738a" font-size="12">DOC007-G004</text>
<text x="68" y="481" fill="#182c42" font-size="16">由应用根据我的历史订单自</text>
<text x="68" y="503" fill="#182c42" font-size="16">动生成一份购物清单。</text>
</g>
<g class="node explicit" data-node="DOC007-G005" tabindex="0" role="button" aria-label="把购物清单存成可复用的模板，并按场景分别定制（如每周常规清单与派对采购清单）。">
<rect x="415" y="428" width="310" height="146" rx="12"/>
<text x="433" y="454" fill="#63738a" font-size="12">DOC007-G005</text>
<text x="433" y="481" fill="#182c42" font-size="16">把购物清单存成可复用的模</text>
<text x="433" y="503" fill="#182c42" font-size="16">板，并按场景分别定制（如</text>
<text x="433" y="525" fill="#182c42" font-size="16">每周常规清单与派对采购清</text>
<text x="433" y="547" fill="#182c42" font-size="16">单）。</text>
</g>
<g class="node explicit" data-node="DOC007-G006" tabindex="0" role="button" aria-label="每隔两周由应用把清单推给我，经我确认后自动下单、再到店自提。">
<rect x="780" y="428" width="310" height="124" rx="12"/>
<text x="798" y="454" fill="#63738a" font-size="12">DOC007-G006</text>
<text x="798" y="481" fill="#182c42" font-size="16">每隔两周由应用把清单推给</text>
<text x="798" y="503" fill="#182c42" font-size="16">我，经我确认后自动下单、</text>
<text x="798" y="525" fill="#182c42" font-size="16">再到店自提。</text>
</g>
<g class="node explicit" data-node="DOC007-G007" tabindex="0" role="button" aria-label="让应用根据我的实际使用方式，主动推荐对我可能有用的功能。">
<rect x="50" y="674" width="310" height="124" rx="12"/>
<text x="68" y="700" fill="#63738a" font-size="12">DOC007-G007</text>
<text x="68" y="727" fill="#182c42" font-size="16">让应用根据我的实际使用方</text>
<text x="68" y="749" fill="#182c42" font-size="16">式，主动推荐对我可能有用</text>
<text x="68" y="771" fill="#182c42" font-size="16">的功能。</text>
</g>
<g class="node explicit" data-node="DOC007-G008" tabindex="0" role="button" aria-label="在浏览特定类目（如零食）时，获得类似信息流的商品推荐。">
<rect x="415" y="674" width="310" height="124" rx="12"/>
<text x="433" y="700" fill="#63738a" font-size="12">DOC007-G008</text>
<text x="433" y="727" fill="#182c42" font-size="16">在浏览特定类目（如零食）</text>
<text x="433" y="749" fill="#182c42" font-size="16">时，获得类似信息流的商品</text>
<text x="433" y="771" fill="#182c42" font-size="16">推荐。</text>
</g>
<g class="node explicit" data-node="DOC007-G009" tabindex="0" role="button" aria-label="购买可能含坚果的商品时，能查到配料表以排除过敏原。">
<rect x="780" y="674" width="310" height="124" rx="12"/>
<text x="798" y="700" fill="#63738a" font-size="12">DOC007-G009</text>
<text x="798" y="727" fill="#182c42" font-size="16">购买可能含坚果的商品时，</text>
<text x="798" y="749" fill="#182c42" font-size="16">能查到配料表以排除过敏原</text>
<text x="798" y="771" fill="#182c42" font-size="16">。</text>
</g>
