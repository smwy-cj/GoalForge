<g class="node explicit" data-node="DOC036-G001" tabindex="0" role="button" aria-label="到陌生城市时快速找到本地卖家，知道他们卖什么、在哪、怎么联系。">
<rect x="50" y="160" width="310" height="124" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC036-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">到陌生城市时快速找到本地</text>
<text x="68" y="235" fill="#182c42" font-size="16">卖家，知道他们卖什么、在</text>
<text x="68" y="257" fill="#182c42" font-size="16">哪、怎么联系。</text>
</g>
<g class="node explicit" data-node="DOC036-G002" tabindex="0" role="button" aria-label="用关键词（如 cakes）搜出对口卖家；结果不准时加上地名再搜。">
<rect x="415" y="160" width="310" height="124" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC036-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">用关键词（如 cakes）搜出</text>
<text x="433" y="235" fill="#182c42" font-size="16">对口卖家；结果不准时加上</text>
<text x="433" y="257" fill="#182c42" font-size="16">地名再搜。</text>
</g>
<g class="node explicit" data-node="DOC036-G003" tabindex="0" role="button" aria-label="节日（如情人节）能按指定礼物找到好店并下单。">
