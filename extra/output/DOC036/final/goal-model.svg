<text x="798" y="186" fill="#63738a" font-size="12">DOC036-G003</text>
<text x="798" y="213" fill="#182c42" font-size="16">节日（如情人节）能按指定</text>
<text x="798" y="235" fill="#182c42" font-size="16">礼物找到好店并下单。</text>
</g>
<g class="node explicit" data-node="DOC036-G004" tabindex="0" role="button" aria-label="没有明确目标时也能刷到多种商品，临场决定买什么。">
