<text x="68" y="410" fill="#63738a" font-size="12">DOC036-G004</text>
<text x="68" y="437" fill="#182c42" font-size="16">没有明确目标时也能刷到多</text>
<text x="68" y="459" fill="#182c42" font-size="16">种商品，临场决定买什么。</text>
</g>
<g class="node explicit" data-node="DOC036-G005" tabindex="0" role="button" aria-label="能从卖家主页直接拿到联系方式，用电话或 WhatsApp 谈价与下单。">
