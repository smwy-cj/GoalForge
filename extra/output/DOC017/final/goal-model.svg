<text x="68" y="186" fill="#63738a" font-size="12">DOC017-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">只收到与自身技能匹配的岗</text>
<text x="68" y="235" fill="#182c42" font-size="16">位（软件工程、机器学习等</text>
<text x="68" y="257" fill="#182c42" font-size="16">），不被无关岗位与陌生人</text>
<text x="68" y="279" fill="#182c42" font-size="16">打扰。</text>
