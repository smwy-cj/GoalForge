<g class="node explicit" data-node="DOC021-G001" tabindex="0" role="button" aria-label="搬到新街区或新国家时，找到可租的新住处。">
<rect x="50" y="160" width="310" height="110" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC021-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">搬到新街区或新国家时，找</text>
<text x="68" y="235" fill="#182c42" font-size="16">到可租的新住处。</text>
</g>
<g class="node explicit" data-node="DOC021-G002" tabindex="0" role="button" aria-label="找到目标地区最主流、当地人最常用的房源平台。">
<rect x="415" y="160" width="310" height="110" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC021-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">找到目标地区最主流、当地</text>
<text x="433" y="235" fill="#182c42" font-size="16">人最常用的房源平台。</text>
</g>
<g class="node explicit" data-node="DOC021-G003" tabindex="0" role="button" aria-label="选到合适的街区：预算与需求集中、靠近工作或学校、有本地人推荐。">
<rect x="780" y="160" width="310" height="124" rx="12"/>
<text x="798" y="186" fill="#63738a" font-size="12">DOC021-G003</text>
<text x="798" y="213" fill="#182c42" font-size="16">选到合适的街区：预算与需</text>
<text x="798" y="235" fill="#182c42" font-size="16">求集中、靠近工作或学校、</text>
<text x="798" y="257" fill="#182c42" font-size="16">有本地人推荐。</text>
</g>
<g class="node explicit" data-node="DOC021-G004" tabindex="0" role="button" aria-label="先用硬条件（面积、卧室数、租金上限）圈定候选，再用软条件（设施、观感）细化。">
<rect x="50" y="384" width="310" height="146" rx="12"/>
<text x="68" y="410" fill="#63738a" font-size="12">DOC021-G004</text>
<text x="68" y="437" fill="#182c42" font-size="16">先用硬条件（面积、卧室数</text>
<text x="68" y="459" fill="#182c42" font-size="16">、租金上限）圈定候选，再</text>
<text x="68" y="481" fill="#182c42" font-size="16">用软条件（设施、观感）细</text>
<text x="68" y="503" fill="#182c42" font-size="16">化。</text>
</g>
<g class="node explicit" data-node="DOC021-G005" tabindex="0" role="button" aria-label="通过对方的回复速度与信息完整度判断房源与房东是否可靠，据此缩小候选。">
<rect x="415" y="384" width="310" height="124" rx="12"/>
<text x="433" y="410" fill="#63738a" font-size="12">DOC021-G005</text>
<text x="433" y="437" fill="#182c42" font-size="16">通过对方的回复速度与信息</text>
<text x="433" y="459" fill="#182c42" font-size="16">完整度判断房源与房东是否</text>
<text x="433" y="481" fill="#182c42" font-size="16">可靠，据此缩小候选。</text>
</g>
<g class="node explicit" data-node="DOC021-G006" tabindex="0" role="button" aria-label="知道房源信息最后更新时间，避免依据过期信息做判断。">
<rect x="780" y="384" width="310" height="124" rx="12"/>
<text x="798" y="410" fill="#63738a" font-size="12">DOC021-G006</text>
<text x="798" y="437" fill="#182c42" font-size="16">知道房源信息最后更新时间</text>
<text x="798" y="459" fill="#182c42" font-size="16">，避免依据过期信息做判断</text>
<text x="798" y="481" fill="#182c42" font-size="16">。</text>
</g>
<g class="node explicit" data-node="DOC021-G007" tabindex="0" role="button" aria-label="清楚知道发出联系后会经历什么、多久有回应。">
<rect x="50" y="630" width="310" height="110" rx="12"/>
<text x="68" y="656" fill="#63738a" font-size="12">DOC021-G007</text>
<text x="68" y="683" fill="#182c42" font-size="16">清楚知道发出联系后会经历</text>
<text x="68" y="705" fill="#182c42" font-size="16">什么、多久有回应。</text>
</g>
<g class="node explicit" data-node="DOC021-G008" tabindex="0" role="button" aria-label="表达意向时不必提交全部个人信息与精确需求。">
<rect x="415" y="630" width="310" height="110" rx="12"/>
<text x="433" y="656" fill="#63738a" font-size="12">DOC021-G008</text>
<text x="433" y="683" fill="#182c42" font-size="16">表达意向时不必提交全部个</text>
<text x="433" y="705" fill="#182c42" font-size="16">人信息与精确需求。</text>
</g>
<g class="node explicit" data-node="DOC021-G009" tabindex="0" role="button" aria-label="像电商加购一样，直接对某个具体房源一键表达意向。">
<rect x="780" y="630" width="310" height="110" rx="12"/>
<text x="798" y="656" fill="#63738a" font-size="12">DOC021-G009</text>
<text x="798" y="683" fill="#182c42" font-size="16">像电商加购一样，直接对某</text>
<text x="798" y="705" fill="#182c42" font-size="16">个具体房源一键表达意向。</text>
</g>
<g class="node explicit" data-node="DOC021-G010" tabindex="0" role="button" aria-label="不注册、不登录也能直接搜索和浏览全部功能。">
<rect x="50" y="840" width="310" height="110" rx="12"/>
<text x="68" y="866" fill="#63738a" font-size="12">DOC021-G010</text>
<text x="68" y="893" fill="#182c42" font-size="16">不注册、不登录也能直接搜</text>
<text x="68" y="915" fill="#182c42" font-size="16">索和浏览全部功能。</text>
</g>
<g class="node explicit" data-node="DOC021-G011" tabindex="0" role="button" aria-label="能在地图上画圈选区，而不只按街区名检索。">
<rect x="415" y="840" width="310" height="110" rx="12"/>
<text x="433" y="866" fill="#63738a" font-size="12">DOC021-G011</text>
<text x="433" y="893" fill="#182c42" font-size="16">能在地图上画圈选区，而不</text>
<text x="433" y="915" fill="#182c42" font-size="16">只按街区名检索。</text>
</g>
<g class="node explicit" data-node="DOC021-G012" tabindex="0" role="button" aria-label="看到真实住户的评价，用来判断房源与房东是否可信。">
<rect x="780" y="840" width="310" height="110" rx="12"/>
<text x="798" y="866" fill="#63738a" font-size="12">DOC021-G012</text>
<text x="798" y="893" fill="#182c42" font-size="16">看到真实住户的评价，用来</text>
<text x="798" y="915" fill="#182c42" font-size="16">判断房源与房东是否可信。</text>
</g>
<g class="node explicit" data-node="DOC021-G013" tabindex="0" role="button" aria-label="收藏的房源能在导航栏或一级菜单里找到。">
<rect x="50" y="1050" width="310" height="110" rx="12"/>
<text x="68" y="1076" fill="#63738a" font-size="12">DOC021-G013</text>
<text x="68" y="1103" fill="#182c42" font-size="16">收藏的房源能在导航栏或一</text>
<text x="68" y="1125" fill="#182c42" font-size="16">级菜单里找到。</text>
</g>
<g class="node explicit" data-node="DOC021-G014" tabindex="0" role="button" aria-label="把三四个候选房源放在同一屏里对比主要条件。">
<rect x="415" y="1050" width="310" height="110" rx="12"/>
<text x="433" y="1076" fill="#63738a" font-size="12">DOC021-G014</text>
<text x="433" y="1103" fill="#182c42" font-size="16">把三四个候选房源放在同一</text>
<text x="433" y="1125" fill="#182c42" font-size="16">屏里对比主要条件。</text>
</g>
<g class="node explicit" data-node="DOC021-G015" tabindex="0" role="button" aria-label="筛选时可以自行选择是否纳入「未填写该条件」的房源，避免误筛掉。">
<rect x="780" y="1050" width="310" height="124" rx="12"/>
<text x="798" y="1076" fill="#63738a" font-size="12">DOC021-G015</text>
<text x="798" y="1103" fill="#182c42" font-size="16">筛选时可以自行选择是否纳</text>
<text x="798" y="1125" fill="#182c42" font-size="16">入「未填写该条件」的房源</text>
<text x="798" y="1147" fill="#182c42" font-size="16">，避免误筛掉。</text>
</g>
<g class="node explicit" data-node="DOC021-G016" tabindex="0" role="button" aria-label="房源照片有统一拍摄规范，避免过度美化或敷衍。">
<rect x="50" y="1274" width="310" height="110" rx="12"/>
<text x="68" y="1300" fill="#63738a" font-size="12">DOC021-G016</text>
<text x="68" y="1327" fill="#182c42" font-size="16">房源照片有统一拍摄规范，</text>
<text x="68" y="1349" fill="#182c42" font-size="16">避免过度美化或敷衍。</text>
</g>
<g class="node explicit" data-node="DOC021-G017" tabindex="0" role="button" aria-label="所有租房沟通都在同一个平台内完成。">
<rect x="415" y="1274" width="310" height="110" rx="12"/>
<text x="433" y="1300" fill="#63738a" font-size="12">DOC021-G017</text>
<text x="433" y="1327" fill="#182c42" font-size="16">所有租房沟通都在同一个平</text>
<text x="433" y="1349" fill="#182c42" font-size="16">台内完成。</text>
</g>
