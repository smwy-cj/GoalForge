<g class="node explicit" data-node="DOC026-G001" tabindex="0" role="button" aria-label="在步行不现实的距离上，实现从一处到另一处的位移。">
<rect x="50" y="160" width="310" height="110" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC026-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">在步行不现实的距离上，实</text>
<text x="68" y="235" fill="#182c42" font-size="16">现从一处到另一处的位移。</text>
</g>
<g class="node explicit" data-node="DOC026-G002" tabindex="0" role="button" aria-label="按耗时与价格权衡是否打车、以及是否改用其他交通方式。">
<rect x="415" y="160" width="310" height="124" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC026-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">按耗时与价格权衡是否打车</text>
<text x="433" y="235" fill="#182c42" font-size="16">、以及是否改用其他交通方</text>
<text x="433" y="257" fill="#182c42" font-size="16">式。</text>
</g>
<g class="node explicit" data-node="DOC026-G003" tabindex="0" role="button" aria-label="在多个车型中选最便宜的一档，人多时改选大车。">
<rect x="780" y="160" width="310" height="110" rx="12"/>
<text x="798" y="186" fill="#63738a" font-size="12">DOC026-G003</text>
<text x="798" y="213" fill="#182c42" font-size="16">在多个车型中选最便宜的一</text>
<text x="798" y="235" fill="#182c42" font-size="16">档，人多时改选大车。</text>
</g>
<g class="node explicit" data-node="DOC026-G004" tabindex="0" role="button" aria-label="下单前能看到附近车辆与预估到达时间、价格，据此决定是否等待或改期。">
<rect x="50" y="384" width="310" height="124" rx="12"/>
<text x="68" y="410" fill="#63738a" font-size="12">DOC026-G004</text>
<text x="68" y="437" fill="#182c42" font-size="16">下单前能看到附近车辆与预</text>
<text x="68" y="459" fill="#182c42" font-size="16">估到达时间、价格，据此决</text>
<text x="68" y="481" fill="#182c42" font-size="16">定是否等待或改期。</text>
</g>
<g class="node explicit" data-node="DOC026-G005" tabindex="0" role="button" aria-label="输入地址时实时给出候选，不必打完就能选。">
<rect x="415" y="384" width="310" height="110" rx="12"/>
<text x="433" y="410" fill="#63738a" font-size="12">DOC026-G005</text>
<text x="433" y="437" fill="#182c42" font-size="16">输入地址时实时给出候选，</text>
<text x="433" y="459" fill="#182c42" font-size="16">不必打完就能选。</text>
</g>
<g class="node explicit" data-node="DOC026-G006" tabindex="0" role="button" aria-label="下单后能真正派到车，不出现长时间等待后「找不到司机」。">
<rect x="780" y="384" width="310" height="124" rx="12"/>
<text x="798" y="410" fill="#63738a" font-size="12">DOC026-G006</text>
<text x="798" y="437" fill="#182c42" font-size="16">下单后能真正派到车，不出</text>
<text x="798" y="459" fill="#182c42" font-size="16">现长时间等待后「找不到司</text>
<text x="798" y="481" fill="#182c42" font-size="16">机」。</text>
</g>
<g class="node explicit" data-node="DOC026-G007" tabindex="0" role="button" aria-label="不因取消订单而拉低自己作为乘客的评分。">
<rect x="50" y="608" width="310" height="110" rx="12"/>
<text x="68" y="634" fill="#63738a" font-size="12">DOC026-G007</text>
<text x="68" y="661" fill="#182c42" font-size="16">不因取消订单而拉低自己作</text>
<text x="68" y="683" fill="#182c42" font-size="16">为乘客的评分。</text>
</g>
<g class="node explicit" data-node="DOC026-G008" tabindex="0" role="button" aria-label="工作出行时以时间优先于价格（费用由公司承担）。">
<rect x="415" y="608" width="310" height="110" rx="12"/>
<text x="433" y="634" fill="#63738a" font-size="12">DOC026-G008</text>
<text x="433" y="661" fill="#182c42" font-size="16">工作出行时以时间优先于价</text>
<text x="433" y="683" fill="#182c42" font-size="16">格（费用由公司承担）。</text>
</g>
<g class="node explicit" data-node="DOC026-G009" tabindex="0" role="button" aria-label="按对地区的熟悉度、路线复杂度与停留时长，在公交、租车与网约车之间选择。">
<rect x="780" y="608" width="310" height="124" rx="12"/>
<text x="798" y="634" fill="#63738a" font-size="12">DOC026-G009</text>
<text x="798" y="661" fill="#182c42" font-size="16">按对地区的熟悉度、路线复</text>
<text x="798" y="683" fill="#182c42" font-size="16">杂度与停留时长，在公交、</text>
<text x="798" y="705" fill="#182c42" font-size="16">租车与网约车之间选择。</text>
</g>
<g class="node explicit" data-node="DOC026-G010" tabindex="0" role="button" aria-label="出问题时能联系到真人客服，而不是只能和机器人对话。">
<rect x="50" y="832" width="310" height="124" rx="12"/>
<text x="68" y="858" fill="#63738a" font-size="12">DOC026-G010</text>
<text x="68" y="885" fill="#182c42" font-size="16">出问题时能联系到真人客服</text>
<text x="68" y="907" fill="#182c42" font-size="16">，而不是只能和机器人对话</text>
<text x="68" y="929" fill="#182c42" font-size="16">。</text>
</g>
<g class="node explicit" data-node="DOC026-G011" tabindex="0" role="button" aria-label="用应用内通话或消息与司机沟通，解决上车点不清、位置难找、自己会迟到等问题。">
<rect x="415" y="832" width="310" height="146" rx="12"/>
<text x="433" y="858" fill="#63738a" font-size="12">DOC026-G011</text>
<text x="433" y="885" fill="#182c42" font-size="16">用应用内通话或消息与司机</text>
<text x="433" y="907" fill="#182c42" font-size="16">沟通，解决上车点不清、位</text>
<text x="433" y="929" fill="#182c42" font-size="16">置难找、自己会迟到等问题</text>
<text x="433" y="951" fill="#182c42" font-size="16">。</text>
</g>
<g class="node explicit" data-node="DOC026-G012" tabindex="0" role="button" aria-label="需要时能方便地修改上车点。">
<rect x="780" y="832" width="310" height="110" rx="12"/>
<text x="798" y="858" fill="#63738a" font-size="12">DOC026-G012</text>
<text x="798" y="885" fill="#182c42" font-size="16">需要时能方便地修改上车点</text>
<text x="798" y="907" fill="#182c42" font-size="16">。</text>
</g>
<g class="node explicit" data-node="DOC026-G013" tabindex="0" role="button" aria-label="行程结束后能评分、给小费，并查看金额用于分摊或报销。">
<rect x="50" y="1078" width="310" height="124" rx="12"/>
<text x="68" y="1104" fill="#63738a" font-size="12">DOC026-G013</text>
<text x="68" y="1131" fill="#182c42" font-size="16">行程结束后能评分、给小费</text>
<text x="68" y="1153" fill="#182c42" font-size="16">，并查看金额用于分摊或报</text>
<text x="68" y="1175" fill="#182c42" font-size="16">销。</text>
</g>
