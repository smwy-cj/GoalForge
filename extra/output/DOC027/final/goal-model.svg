<g class="node explicit" data-node="DOC027-G001" tabindex="0" role="button" aria-label="不同平台各司其职，各自满足一种具体需求。">
<rect x="50" y="160" width="310" height="110" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC027-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">不同平台各司其职，各自满</text>
<text x="68" y="235" fill="#182c42" font-size="16">足一种具体需求。</text>
</g>
<g class="node explicit" data-node="DOC027-G002" tabindex="0" role="button" aria-label="快速跟进全球正在发生的事，跟上热点。">
<rect x="415" y="160" width="310" height="110" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC027-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">快速跟进全球正在发生的事</text>
<text x="433" y="235" fill="#182c42" font-size="16">，跟上热点。</text>
</g>
<g class="node explicit" data-node="DOC027-G003" tabindex="0" role="button" aria-label="与朋友实时分享日常，维持跨国关系。">
<rect x="780" y="160" width="310" height="110" rx="12"/>
<text x="798" y="186" fill="#63738a" font-size="12">DOC027-G003</text>
<text x="798" y="213" fill="#182c42" font-size="16">与朋友实时分享日常，维持</text>
<text x="798" y="235" fill="#182c42" font-size="16">跨国关系。</text>
</g>
<g class="node explicit" data-node="DOC027-G004" tabindex="0" role="button" aria-label="在不暴露身份的前提下提问、也帮别人解答。">
<rect x="50" y="370" width="310" height="110" rx="12"/>
<text x="68" y="396" fill="#63738a" font-size="12">DOC027-G004</text>
<text x="68" y="423" fill="#182c42" font-size="16">在不暴露身份的前提下提问</text>
<text x="68" y="445" fill="#182c42" font-size="16">、也帮别人解答。</text>
</g>
<g class="node explicit" data-node="DOC027-G005" tabindex="0" role="button" aria-label="账号不被任何他人访问，靠强认证兜住。">
<rect x="415" y="370" width="310" height="110" rx="12"/>
<text x="433" y="396" fill="#63738a" font-size="12">DOC027-G005</text>
<text x="433" y="423" fill="#182c42" font-size="16">账号不被任何他人访问，靠</text>
<text x="433" y="445" fill="#182c42" font-size="16">强认证兜住。</text>
</g>
<g class="node explicit" data-node="DOC027-G006" tabindex="0" role="button" aria-label="自己发布的内容留在原处，只有本人能删除或归档。">
<rect x="780" y="370" width="310" height="110" rx="12"/>
<text x="798" y="396" fill="#63738a" font-size="12">DOC027-G006</text>
<text x="798" y="423" fill="#182c42" font-size="16">自己发布的内容留在原处，</text>
<text x="798" y="445" fill="#182c42" font-size="16">只有本人能删除或归档。</text>
</g>
<g class="node explicit" data-node="DOC027-G007" tabindex="0" role="button" aria-label="平台稳定可用，宕机不要成为常态。">
<rect x="50" y="580" width="310" height="110" rx="12"/>
<text x="68" y="606" fill="#63738a" font-size="12">DOC027-G007</text>
<text x="68" y="633" fill="#182c42" font-size="16">平台稳定可用，宕机不要成</text>
<text x="68" y="655" fill="#182c42" font-size="16">为常态。</text>
</g>
<g class="node explicit" data-node="DOC027-G008" tabindex="0" role="button" aria-label="私人对话不被陌生人看到，也不被拿去投放广告。">
<rect x="415" y="580" width="310" height="110" rx="12"/>
<text x="433" y="606" fill="#63738a" font-size="12">DOC027-G008</text>
<text x="433" y="633" fill="#182c42" font-size="16">私人对话不被陌生人看到，</text>
<text x="433" y="655" fill="#182c42" font-size="16">也不被拿去投放广告。</text>
</g>
<g class="node explicit" data-node="DOC027-G009" tabindex="0" role="button" aria-label="信息流能连续加载，不出现内容断层。">
<rect x="780" y="580" width="310" height="110" rx="12"/>
<text x="798" y="606" fill="#63738a" font-size="12">DOC027-G009</text>
<text x="798" y="633" fill="#182c42" font-size="16">信息流能连续加载，不出现</text>
<text x="798" y="655" fill="#182c42" font-size="16">内容断层。</text>
</g>
<g class="node explicit" data-node="DOC027-G010" tabindex="0" role="button" aria-label="能按地理位置获取家乡或本地正在发生的事。">
<rect x="50" y="790" width="310" height="110" rx="12"/>
<text x="68" y="816" fill="#63738a" font-size="12">DOC027-G010</text>
<text x="68" y="843" fill="#182c42" font-size="16">能按地理位置获取家乡或本</text>
<text x="68" y="865" fill="#182c42" font-size="16">地正在发生的事。</text>
</g>
<g class="node explicit" data-node="DOC027-G011" tabindex="0" role="button" aria-label="在非常小众的处境下也能找到亲历者的经验（如某公司的面试）。">
<rect x="415" y="790" width="310" height="124" rx="12"/>
<text x="433" y="816" fill="#63738a" font-size="12">DOC027-G011</text>
<text x="433" y="843" fill="#182c42" font-size="16">在非常小众的处境下也能找</text>
<text x="433" y="865" fill="#182c42" font-size="16">到亲历者的经验（如某公司</text>
<text x="433" y="887" fill="#182c42" font-size="16">的面试）。</text>
</g>
<g class="node explicit" data-node="DOC027-G012" tabindex="0" role="button" aria-label="看到多样化的内容，而不是被算法反复推同一类。">
<rect x="780" y="790" width="310" height="110" rx="12"/>
<text x="798" y="816" fill="#63738a" font-size="12">DOC027-G012</text>
<text x="798" y="843" fill="#182c42" font-size="16">看到多样化的内容，而不是</text>
<text x="798" y="865" fill="#182c42" font-size="16">被算法反复推同一类。</text>
</g>
<g class="node explicit" data-node="DOC027-G013" tabindex="0" role="button" aria-label="广告投放要克制：同一件东西推过几次、被跳过就停。">
<rect x="50" y="1014" width="310" height="110" rx="12"/>
<text x="68" y="1040" fill="#63738a" font-size="12">DOC027-G013</text>
<text x="68" y="1067" fill="#182c42" font-size="16">广告投放要克制：同一件东</text>
<text x="68" y="1089" fill="#182c42" font-size="16">西推过几次、被跳过就停。</text>
</g>
<g class="node explicit" data-node="DOC027-G014" tabindex="0" role="button" aria-label="把多个平台的内容聚合到一个应用里，减少来回切换。">
<rect x="415" y="1014" width="310" height="110" rx="12"/>
<text x="433" y="1040" fill="#63738a" font-size="12">DOC027-G014</text>
<text x="433" y="1067" fill="#182c42" font-size="16">把多个平台的内容聚合到一</text>
<text x="433" y="1089" fill="#182c42" font-size="16">个应用里，减少来回切换。</text>
</g>
