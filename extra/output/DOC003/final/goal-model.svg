<g class="node explicit" data-node="DOC003-G001" tabindex="0" role="button" aria-label="拿到当前可找到的最优票价（价格合理，且是认真比价后的结果）。">
<rect x="50" y="160" width="310" height="124" rx="12"/>
<text x="68" y="186" fill="#63738a" font-size="12">DOC003-G001</text>
<text x="68" y="213" fill="#182c42" font-size="16">拿到当前可找到的最优票价</text>
<text x="68" y="235" fill="#182c42" font-size="16">（价格合理，且是认真比价</text>
<text x="68" y="257" fill="#182c42" font-size="16">后的结果）。</text>
</g>
<g class="node explicit" data-node="DOC003-G002" tabindex="0" role="button" aria-label="拿到行程本身合适（时间与衔接可行）的机票，而不只是便宜。">
<rect x="415" y="160" width="310" height="124" rx="12"/>
<text x="433" y="186" fill="#63738a" font-size="12">DOC003-G002</text>
<text x="433" y="213" fill="#182c42" font-size="16">拿到行程本身合适（时间与</text>
<text x="433" y="235" fill="#182c42" font-size="16">衔接可行）的机票，而不只</text>
<text x="433" y="257" fill="#182c42" font-size="16">是便宜。</text>
</g>
<g class="node explicit" data-node="DOC003-G003" tabindex="0" role="button" aria-label="中转停留时间不低于最短衔接时间（MCT）的 1.5 倍。">
<rect x="50" y="1056" width="310" height="110" rx="12"/>
<text x="68" y="1082" fill="#63738a" font-size="12">DOC003-G003</text>
<text x="68" y="1109" fill="#182c42" font-size="16">中转停留时间不低于最短衔</text>
<text x="68" y="1131" fill="#182c42" font-size="16">接时间（MCT）的 1.5 倍。</text>
</g>
<g class="node explicit" data-node="DOC003-G004" tabindex="0" role="button" aria-label="航班起降时间能与后续接驳交通、以及要会面对象的日程衔接，避免长时间空等。">
<rect x="415" y="1056" width="310" height="124" rx="12"/>
<text x="433" y="1082" fill="#63738a" font-size="12">DOC003-G004</text>
<text x="433" y="1109" fill="#182c42" font-size="16">航班起降时间能与后续接驳</text>
<text x="433" y="1131" fill="#182c42" font-size="16">交通、以及要会面对象的日</text>
<text x="433" y="1153" fill="#182c42" font-size="16">程衔接，避免长时间空等。</text>
</g>
<g class="node explicit" data-node="DOC003-G005" tabindex="0" role="button" aria-label="避开耗时过长（40–60 小时）与红眼时段的航班，保证行程时长与睡眠。">
<rect x="780" y="1056" width="310" height="124" rx="12"/>
<text x="798" y="1082" fill="#63738a" font-size="12">DOC003-G005</text>
<text x="798" y="1109" fill="#182c42" font-size="16">避开耗时过长（40–60 小时</text>
<text x="798" y="1131" fill="#182c42" font-size="16">）与红眼时段的航班，保证</text>
<text x="798" y="1153" fill="#182c42" font-size="16">行程时长与睡眠。</text>
</g>
<g class="node explicit" data-node="DOC003-G006" tabindex="0" role="button" aria-label="对同一行程比较多个订票供应商的最终价格与可用折扣，再决定在哪下单。">
<rect x="780" y="160" width="310" height="124" rx="12"/>
<text x="798" y="186" fill="#63738a" font-size="12">DOC003-G006</text>
<text x="798" y="213" fill="#182c42" font-size="16">对同一行程比较多个订票供</text>
<text x="798" y="235" fill="#182c42" font-size="16">应商的最终价格与可用折扣</text>
<text x="798" y="257" fill="#182c42" font-size="16">，再决定在哪下单。</text>
</g>
<g class="node explicit" data-node="DOC003-G007" tabindex="0" role="button" aria-label="一次并行比较大量出发地/目的地/日期/舱位组合，而不是逐个查询。">
<rect x="50" y="384" width="310" height="124" rx="12"/>
<text x="68" y="410" fill="#63738a" font-size="12">DOC003-G007</text>
<text x="68" y="437" fill="#182c42" font-size="16">一次并行比较大量出发地/目</text>
<text x="68" y="459" fill="#182c42" font-size="16">的地/日期/舱位组合，而不</text>
<text x="68" y="481" fill="#182c42" font-size="16">是逐个查询。</text>
</g>
<g class="node explicit" data-node="DOC003-G008" tabindex="0" role="button" aria-label="提前约 1–2 个月订票，以换取更好的价格。">
<rect x="415" y="384" width="310" height="110" rx="12"/>
<text x="433" y="410" fill="#63738a" font-size="12">DOC003-G008</text>
<text x="433" y="437" fill="#182c42" font-size="16">提前约 1–2 个月订票，以换</text>
<text x="433" y="459" fill="#182c42" font-size="16">取更好的价格。</text>
</g>
<g class="node explicit" data-node="DOC003-G009" tabindex="0" role="button" aria-label="搜索与比价时保持匿名、不登录，避免个人数据被共享或被追踪抬价。">
<rect x="780" y="384" width="310" height="124" rx="12"/>
<text x="798" y="410" fill="#63738a" font-size="12">DOC003-G009</text>
<text x="798" y="437" fill="#182c42" font-size="16">搜索与比价时保持匿名、不</text>
<text x="798" y="459" fill="#182c42" font-size="16">登录，避免个人数据被共享</text>
<text x="798" y="481" fill="#182c42" font-size="16">或被追踪抬价。</text>
</g>
<g class="node explicit" data-node="DOC003-G010" tabindex="0" role="button" aria-label="在陌生市场能判断票价相对水平（高于/低于中位），以便决定是否值得下单。">
<rect x="50" y="608" width="310" height="124" rx="12"/>
<text x="68" y="634" fill="#63738a" font-size="12">DOC003-G010</text>
<text x="68" y="661" fill="#182c42" font-size="16">在陌生市场能判断票价相对</text>
<text x="68" y="683" fill="#182c42" font-size="16">水平（高于/低于中位），以</text>
<text x="68" y="705" fill="#182c42" font-size="16">便决定是否值得下单。</text>
</g>
<g class="node explicit" data-node="DOC003-G011" tabindex="0" role="button" aria-label="对多条候选航线设置降价提醒，价格下探时及时获知并下单。">
<rect x="415" y="608" width="310" height="124" rx="12"/>
<text x="433" y="634" fill="#63738a" font-size="12">DOC003-G011</text>
<text x="433" y="661" fill="#182c42" font-size="16">对多条候选航线设置降价提</text>
<text x="433" y="683" fill="#182c42" font-size="16">醒，价格下探时及时获知并</text>
<text x="433" y="705" fill="#182c42" font-size="16">下单。</text>
</g>
<g class="node explicit" data-node="DOC003-G012" tabindex="0" role="button" aria-label="在一个平台上集齐比价、行程与订票信息，不必往返十余个网站。">
<rect x="780" y="608" width="310" height="124" rx="12"/>
<text x="798" y="634" fill="#63738a" font-size="12">DOC003-G012</text>
<text x="798" y="661" fill="#182c42" font-size="16">在一个平台上集齐比价、行</text>
<text x="798" y="683" fill="#182c42" font-size="16">程与订票信息，不必往返十</text>
<text x="798" y="705" fill="#182c42" font-size="16">余个网站。</text>
</g>
<g class="node explicit" data-node="DOC003-G013" tabindex="0" role="button" aria-label="输入全部参数后，由平台直接给出最优方案，不必自己逐轮迭代。">
<rect x="50" y="832" width="310" height="124" rx="12"/>
