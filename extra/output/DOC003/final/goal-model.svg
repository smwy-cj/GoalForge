<text x="68" y="885" fill="#182c42" font-size="16">输入全部参数后，由平台直</text>
<text x="68" y="907" fill="#182c42" font-size="16">接给出最优方案，不必自己</text>
<text x="68" y="929" fill="#182c42" font-size="16">逐轮迭代。</text>
</g>
<g class="node explicit" data-node="DOC003-G014" tabindex="0" role="button" aria-label="把信用卡权益与机场休息室准入信息整合进比价流程，便于在中转时使用休息室。">
