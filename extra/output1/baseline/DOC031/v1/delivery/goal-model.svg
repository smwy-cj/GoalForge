<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2502 218" width="2502" height="218" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G1" tabindex="0" role="button" aria-label="通过Slack与大学内的同学、助教和教授即时沟通。"><title>通过Slack与大学内的同学、助教和教授即时沟通。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过Slack与大学内的同学、</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">助教和教授即时沟通。</text>
</g>
<g class="dag-node goal-node" data-goal="G2" tabindex="0" role="button" aria-label="只知道姓名或姓氏即可找到并联系校内人员，无需预先保存电话或邮箱，手机和笔记本上均能使用。"><title>只知道姓名或姓氏即可找到并联系校内人员，无需预先保存电话或邮箱，手机和笔记本上均能使用。</title><rect x="312.0" y="38" width="234" height="110" rx="12"/>
<text x="429.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">只知道姓名或姓氏即可找到并</text>
<text x="429.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">联系校内人员，无需预先保存</text>
<text x="429.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">电话或邮箱，手机和笔记本上</text>
<text x="429.0" y="128.0" text-anchor="middle" font-size="15" fill="#203d38">均能使用。</text>
</g>
<g class="dag-node goal-node" data-goal="G3" tabindex="0" role="button" aria-label="通过频道迅速向较广的受众传达信息。"><title>通过频道迅速向较广的受众传达信息。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过频道迅速向较广的受众传</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">达信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G4" tabindex="0" role="button" aria-label="加入频道后可查看加入前的历史信息，并了解课程、项目、院系和校园的讨论动态。"><title>加入频道后可查看加入前的历史信息，并了解课程、项目、院系和校园的讨论动态。</title><rect x="860.0" y="38" width="234" height="90" rx="12"/>
<text x="977.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">加入频道后可查看加入前的历</text>
<text x="977.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">史信息，并了解课程、项目、</text>
<text x="977.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">院系和校园的讨论动态。</text>
</g>
<g class="dag-node goal-node" data-goal="G5" tabindex="0" role="button" aria-label="与队友协作时，即时分享所需文档。"><title>与队友协作时，即时分享所需文档。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">与队友协作时，即时分享所需</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">文档。</text>
</g>
<g class="dag-node goal-node" data-goal="G6" tabindex="0" role="button" aria-label="搜索大量频道历史时，更容易找到自己需要的特定消息。"><title>搜索大量频道历史时，更容易找到自己需要的特定消息。</title><rect x="1408.0" y="38" width="234" height="76" rx="12"/>
<text x="1525.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">搜索大量频道历史时，更容易</text>
<text x="1525.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">找到自己需要的特定消息。</text>
</g>
<g class="dag-node goal-node" data-goal="G7" tabindex="0" role="button" aria-label="更方便、快速地进入语音或视频通话，尤其是群组通话。"><title>更方便、快速地进入语音或视频通话，尤其是群组通话。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">更方便、快速地进入语音或视</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">频通话，尤其是群组通话。</text>
</g>
<g class="dag-node goal-node" data-goal="G8" tabindex="0" role="button" aria-label="正式联系助教或教授时，能从Slack快捷跳转到Outlook、Gmail等邮件应用给对方发邮件。"><title>正式联系助教或教授时，能从Slack快捷跳转到Outlook、Gmail等邮件应用给对方发邮件。</title><rect x="1956.0" y="38" width="234" height="110" rx="12"/>
<text x="2073.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">正式联系助教或教授时，能从</text>
<text x="2073.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">Slack快捷跳转到Outlook、Gm</text>
<text x="2073.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">ail等邮件应用给对方发邮件</text>
<text x="2073.0" y="128.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G9" tabindex="0" role="button" aria-label="多个窗口并排、Slack浏览器窗口缩小时，仍能方便地导航。"><title>多个窗口并排、Slack浏览器窗口缩小时，仍能方便地导航。</title><rect x="2230.0" y="38" width="234" height="90" rx="12"/>
<text x="2347.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">多个窗口并排、Slack浏览器</text>
<text x="2347.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">窗口缩小时，仍能方便地导航</text>
<text x="2347.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
</svg>