<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2228 198" width="2228" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G1" tabindex="0" role="button" aria-label="增加LinkedIn个人档案上的人脉连接数量。"><title>增加LinkedIn个人档案上的人脉连接数量。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">增加LinkedIn个人档案上的人</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">脉连接数量。</text>
</g>
<g class="dag-node goal-node" data-goal="G2" tabindex="0" role="button" aria-label="通过个人档案向他人展示自己在LinkedIn上活跃。"><title>通过个人档案向他人展示自己在LinkedIn上活跃。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过个人档案向他人展示自己</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">在LinkedIn上活跃。</text>
</g>
<g class="dag-node goal-node" data-goal="G3" tabindex="0" role="button" aria-label="获得目标公司的现任员工为实习或全职岗位提供内推。"><title>获得目标公司的现任员工为实习或全职岗位提供内推。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">获得目标公司的现任员工为实</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">习或全职岗位提供内推。</text>
</g>
<g class="dag-node goal-node" data-goal="G4" tabindex="0" role="button" aria-label="借助内推提高简历被招聘人员看到的机会。"><title>借助内推提高简历被招聘人员看到的机会。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助内推提高简历被招聘人员</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">看到的机会。</text>
</g>
<g class="dag-node goal-node" data-goal="G5" tabindex="0" role="button" aria-label="寻找并选择同时是目标公司现任员工和本校校友的潜在人脉，以提高获得内推的可能性。"><title>寻找并选择同时是目标公司现任员工和本校校友的潜在人脉，以提高获得内推的可能性。</title><rect x="1134.0" y="38" width="234" height="90" rx="12"/>
<text x="1251.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">寻找并选择同时是目标公司现</text>
<text x="1251.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">任员工和本校校友的潜在人脉</text>
<text x="1251.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">，以提高获得内推的可能性。</text>
</g>
<g class="dag-node goal-node" data-goal="G6" tabindex="0" role="button" aria-label="搜索结果更准确地匹配所需潜在人脉的背景，减少逐个排除不匹配结果的负担。"><title>搜索结果更准确地匹配所需潜在人脉的背景，减少逐个排除不匹配结果的负担。</title><rect x="1408.0" y="38" width="234" height="90" rx="12"/>
<text x="1525.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">搜索结果更准确地匹配所需潜</text>
<text x="1525.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">在人脉的背景，减少逐个排除</text>
<text x="1525.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">不匹配结果的负担。</text>
</g>
<g class="dag-node goal-node" data-goal="G7" tabindex="0" role="button" aria-label="能够查看足够多的潜在人脉，以找到符合需要的联系对象。"><title>能够查看足够多的潜在人脉，以找到符合需要的联系对象。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">能够查看足够多的潜在人脉，</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">以找到符合需要的联系对象。</text>
</g>
<g class="dag-node goal-node" data-goal="G8" tabindex="0" role="button" aria-label="连接邀请获接受前，能够在附言中充分表达自我介绍和内推意图，减少压缩措辞的时间。"><title>连接邀请获接受前，能够在附言中充分表达自我介绍和内推意图，减少压缩措辞的时间。</title><rect x="1956.0" y="38" width="234" height="90" rx="12"/>
<text x="2073.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">连接邀请获接受前，能够在附</text>
<text x="2073.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">言中充分表达自我介绍和内推</text>
<text x="2073.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">意图，减少压缩措辞的时间。</text>
</g>
</svg>