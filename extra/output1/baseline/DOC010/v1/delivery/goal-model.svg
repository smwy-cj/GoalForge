<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2776 198" width="2776" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G1" tabindex="0" role="button" aria-label="根据天气规划日常穿着、携带物品、户外活动和旅行。"><title>根据天气规划日常穿着、携带物品、户外活动和旅行。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">根据天气规划日常穿着、携带</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">物品、户外活动和旅行。</text>
</g>
<g class="dag-node goal-node" data-goal="G2" tabindex="0" role="button" aria-label="日常外出前了解当天的天气，以决定穿着和携带物品。"><title>日常外出前了解当天的天气，以决定穿着和携带物品。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">日常外出前了解当天的天气，</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">以决定穿着和携带物品。</text>
</g>
<g class="dag-node goal-node" data-goal="G3" tabindex="0" role="button" aria-label="计划旅行时，在购买户外活动门票前了解目的地一周天气，以安排活动。"><title>计划旅行时，在购买户外活动门票前了解目的地一周天气，以安排活动。</title><rect x="586.0" y="38" width="234" height="90" rx="12"/>
<text x="703.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">计划旅行时，在购买户外活动</text>
<text x="703.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">门票前了解目的地一周天气，</text>
<text x="703.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">以安排活动。</text>
</g>
<g class="dag-node goal-node" data-goal="G4" tabindex="0" role="button" aria-label="到不熟悉的地方时，借助天气应用熟悉当地天气状况。"><title>到不熟悉的地方时，借助天气应用熟悉当地天气状况。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">到不熟悉的地方时，借助天气</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">应用熟悉当地天气状况。</text>
</g>
<g class="dag-node goal-node" data-goal="G5" tabindex="0" role="button" aria-label="收到雷暴、洪水等极端天气的通知或警报，以便推迟活动并避免外出。"><title>收到雷暴、洪水等极端天气的通知或警报，以便推迟活动并避免外出。</title><rect x="1134.0" y="38" width="234" height="90" rx="12"/>
<text x="1251.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">收到雷暴、洪水等极端天气的</text>
<text x="1251.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">通知或警报，以便推迟活动并</text>
<text x="1251.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">避免外出。</text>
</g>
<g class="dag-node goal-node" data-goal="G6" tabindex="0" role="button" aria-label="常规天气通知每天早晨、下午和晚上各一次，以融入通常外出的日程。"><title>常规天气通知每天早晨、下午和晚上各一次，以融入通常外出的日程。</title><rect x="1408.0" y="38" width="234" height="90" rx="12"/>
<text x="1525.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">常规天气通知每天早晨、下午</text>
<text x="1525.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">和晚上各一次，以融入通常外</text>
<text x="1525.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">出的日程。</text>
</g>
<g class="dag-node goal-node" data-goal="G7" tabindex="0" role="button" aria-label="持续降雨时，更频繁地收到降雨开始、停止及变化的通知。"><title>持续降雨时，更频繁地收到降雨开始、停止及变化的通知。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">持续降雨时，更频繁地收到降</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">雨开始、停止及变化的通知。</text>
</g>
<g class="dag-node goal-node" data-goal="G8" tabindex="0" role="button" aria-label="获得实时天气更新，帮助在外出时决定步行还是乘车等安排。"><title>获得实时天气更新，帮助在外出时决定步行还是乘车等安排。</title><rect x="1956.0" y="38" width="234" height="90" rx="12"/>
<text x="2073.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">获得实时天气更新，帮助在外</text>
<text x="2073.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">出时决定步行还是乘车等安排</text>
<text x="2073.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G9" tabindex="0" role="button" aria-label="天气信息在应用、网站及其他使用的平台之间保持一致。"><title>天气信息在应用、网站及其他使用的平台之间保持一致。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">天气信息在应用、网站及其他</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">使用的平台之间保持一致。</text>
</g>
<g class="dag-node goal-node" data-goal="G10" tabindex="0" role="button" aria-label="使用天气应用时不受广告打扰。"><title>使用天气应用时不受广告打扰。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">使用天气应用时不受广告打扰</text>
<text x="2621.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
</svg>