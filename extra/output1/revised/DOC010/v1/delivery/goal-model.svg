<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3598 198" width="3598" height="198" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G01" tabindex="0" role="button" aria-label="借助天气信息安排自己的着装、户外活动或旅行。"><title>借助天气信息安排自己的着装、户外活动或旅行。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助天气信息安排自己的着装</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">、户外活动或旅行。</text>
</g>
<g class="dag-node goal-node" data-goal="G02" tabindex="0" role="button" aria-label="根据日常天气决定当天穿什么、携带什么。"><title>根据日常天气决定当天穿什么、携带什么。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">根据日常天气决定当天穿什么</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">、携带什么。</text>
</g>
<g class="dag-node goal-node" data-goal="G03" tabindex="0" role="button" aria-label="规划旅行时查看整周天气，以便在购买活动门票前安排户外活动。"><title>规划旅行时查看整周天气，以便在购买活动门票前安排户外活动。</title><rect x="586.0" y="38" width="234" height="90" rx="12"/>
<text x="703.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">规划旅行时查看整周天气，以</text>
<text x="703.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">便在购买活动门票前安排户外</text>
<text x="703.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">活动。</text>
</g>
<g class="dag-node goal-node" data-goal="G04" tabindex="0" role="button" aria-label="到不熟悉的地方时，通过天气信息熟悉当地天气状况。"><title>到不熟悉的地方时，通过天气信息熟悉当地天气状况。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">到不熟悉的地方时，通过天气</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">信息熟悉当地天气状况。</text>
</g>
<g class="dag-node goal-node" data-goal="G05" tabindex="0" role="button" aria-label="极端天气发生时，希望天气应用提供通知或警报。"><title>极端天气发生时，希望天气应用提供通知或警报。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">极端天气发生时，希望天气应</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">用提供通知或警报。</text>
</g>
<g class="dag-node goal-node" data-goal="G06" tabindex="0" role="button" aria-label="看到雷暴、洪水等极端天气信息时，推迟整个活动并避免外出。"><title>看到雷暴、洪水等极端天气信息时，推迟整个活动并避免外出。</title><rect x="1408.0" y="38" width="234" height="90" rx="12"/>
<text x="1525.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">看到雷暴、洪水等极端天气信</text>
<text x="1525.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">息时，推迟整个活动并避免外</text>
<text x="1525.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">出。</text>
</g>
<g class="dag-node goal-node" data-goal="G07" tabindex="0" role="button" aria-label="平常更愿意在早晨、下午和晚上每天约三次收到天气通知，以配合外出安排。"><title>平常更愿意在早晨、下午和晚上每天约三次收到天气通知，以配合外出安排。</title><rect x="1682.0" y="38" width="234" height="90" rx="12"/>
<text x="1799.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">平常更愿意在早晨、下午和晚</text>
<text x="1799.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">上每天约三次收到天气通知，</text>
<text x="1799.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">以配合外出安排。</text>
</g>
<g class="dag-node goal-node" data-goal="G08" tabindex="0" role="button" aria-label="下雨时更频繁地收到雨势变化、开始或停止的更新通知。"><title>下雨时更频繁地收到雨势变化、开始或停止的更新通知。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">下雨时更频繁地收到雨势变化</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">、开始或停止的更新通知。</text>
</g>
<g class="dag-node goal-node" data-goal="G09" tabindex="0" role="button" aria-label="希望天气应用提供实时天气更新。"><title>希望天气应用提供实时天气更新。</title><rect x="2230.0" y="38" width="234" height="76" rx="12"/>
<text x="2347.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望天气应用提供实时天气更</text>
<text x="2347.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">新。</text>
</g>
<g class="dag-node goal-node" data-goal="G10" tabindex="0" role="button" aria-label="更愿意使用没有广告干扰的天气应用。"><title>更愿意使用没有广告干扰的天气应用。</title><rect x="2504.0" y="38" width="234" height="76" rx="12"/>
<text x="2621.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">更愿意使用没有广告干扰的天</text>
<text x="2621.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">气应用。</text>
</g>
<g class="dag-node goal-node" data-goal="G11" tabindex="0" role="button" aria-label="希望各平台上的天气信息保持一致。"><title>希望各平台上的天气信息保持一致。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望各平台上的天气信息保持</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">一致。</text>
</g>
<g class="dag-node goal-node" data-goal="G12" tabindex="0" role="button" aria-label="希望外出决策所依据的天气信息更可靠，减少因错误预报而意外淋雨的情况。"><title>希望外出决策所依据的天气信息更可靠，减少因错误预报而意外淋雨的情况。</title><rect x="3052.0" y="38" width="234" height="90" rx="12"/>
<text x="3169.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">希望外出决策所依据的天气信</text>
<text x="3169.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">息更可靠，减少因错误预报而</text>
<text x="3169.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">意外淋雨的情况。</text>
</g>
<g class="dag-node goal-node" data-goal="G13" tabindex="0" role="button" aria-label="早晨希望方便地获得足够有用的天气信息来安排当天准备。"><title>早晨希望方便地获得足够有用的天气信息来安排当天准备。</title><rect x="3326.0" y="38" width="234" height="76" rx="12"/>
<text x="3443.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">早晨希望方便地获得足够有用</text>
<text x="3443.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">的天气信息来安排当天准备。</text>
</g>
</svg>