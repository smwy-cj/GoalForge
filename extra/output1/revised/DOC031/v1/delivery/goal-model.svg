<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3050 218" width="3050" height="218" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<g class="dag-node goal-node" data-goal="G01" tabindex="0" role="button" aria-label="在大学内与同学、助教和教授保持即时沟通。"><title>在大学内与同学、助教和教授保持即时沟通。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">在大学内与同学、助教和教授</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">保持即时沟通。</text>
</g>
<g class="dag-node goal-node" data-goal="G02" tabindex="0" role="button" aria-label="只知道校内对象的姓名或姓氏时，也能快速找到并联系对方，无需先保存电话或邮箱。"><title>只知道校内对象的姓名或姓氏时，也能快速找到并联系对方，无需先保存电话或邮箱。</title><rect x="312.0" y="38" width="234" height="90" rx="12"/>
<text x="429.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">只知道校内对象的姓名或姓氏</text>
<text x="429.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">时，也能快速找到并联系对方</text>
<text x="429.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">，无需先保存电话或邮箱。</text>
</g>
<g class="dag-node goal-node" data-goal="G03" tabindex="0" role="button" aria-label="能在手机或笔记本电脑上联系校内人员。"><title>能在手机或笔记本电脑上联系校内人员。</title><rect x="586.0" y="38" width="234" height="76" rx="12"/>
<text x="703.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">能在手机或笔记本电脑上联系</text>
<text x="703.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">校内人员。</text>
</g>
<g class="dag-node goal-node" data-goal="G04" tabindex="0" role="button" aria-label="通过频道立即向较广的受众传达信息。"><title>通过频道立即向较广的受众传达信息。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">通过频道立即向较广的受众传</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">达信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G05" tabindex="0" role="button" aria-label="加入频道后，仍能获取自己加入之前的历史信息。"><title>加入频道后，仍能获取自己加入之前的历史信息。</title><rect x="1134.0" y="38" width="234" height="76" rx="12"/>
<text x="1251.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">加入频道后，仍能获取自己加</text>
<text x="1251.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">入之前的历史信息。</text>
</g>
<g class="dag-node goal-node" data-goal="G06" tabindex="0" role="button" aria-label="了解频道中课程、系所、项目和校园正在讨论或分享的事情。"><title>了解频道中课程、系所、项目和校园正在讨论或分享的事情。</title><rect x="1408.0" y="38" width="234" height="90" rx="12"/>
<text x="1525.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">了解频道中课程、系所、项目</text>
<text x="1525.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">和校园正在讨论或分享的事情</text>
<text x="1525.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G07" tabindex="0" role="button" aria-label="与队友协作时，能即时分享所需文档。"><title>与队友协作时，能即时分享所需文档。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">与队友协作时，能即时分享所</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">需文档。</text>
</g>
<g class="dag-node goal-node" data-goal="G08" tabindex="0" role="button" aria-label="希望更容易从大量关键词搜索结果中找到自己所需的消息或讨论记录。"><title>希望更容易从大量关键词搜索结果中找到自己所需的消息或讨论记录。</title><rect x="1956.0" y="38" width="234" height="90" rx="12"/>
<text x="2073.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">希望更容易从大量关键词搜索</text>
<text x="2073.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">结果中找到自己所需的消息或</text>
<text x="2073.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">讨论记录。</text>
</g>
<g class="dag-node goal-node" data-goal="G09" tabindex="0" role="button" aria-label="希望更容易、更快捷地进入音频或视频通话，尤其是群组通话。"><title>希望更容易、更快捷地进入音频或视频通话，尤其是群组通话。</title><rect x="2230.0" y="38" width="234" height="90" rx="12"/>
<text x="2347.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">希望更容易、更快捷地进入音</text>
<text x="2347.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">频或视频通话，尤其是群组通</text>
<text x="2347.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">话。</text>
</g>
<g class="dag-node goal-node" data-goal="G10" tabindex="0" role="button" aria-label="需要与助教或教授正式沟通时，希望从 Slack 快速跳转到标准邮件应用，向该对象发送邮件。"><title>需要与助教或教授正式沟通时，希望从 Slack 快速跳转到标准邮件应用，向该对象发送邮件。</title><rect x="2504.0" y="38" width="234" height="110" rx="12"/>
<text x="2621.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">需要与助教或教授正式沟通时</text>
<text x="2621.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">，希望从 Slack 快速跳转到</text>
<text x="2621.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">标准邮件应用，向该对象发送</text>
<text x="2621.0" y="128.0" text-anchor="middle" font-size="15" fill="#203d38">邮件。</text>
</g>
<g class="dag-node goal-node" data-goal="G11" tabindex="0" role="button" aria-label="希望可以改善 Slack 浏览器窗口缩窄时的导航便利性。"><title>希望可以改善 Slack 浏览器窗口缩窄时的导航便利性。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">希望可以改善 Slack 浏览器</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">窗口缩窄时的导航便利性。</text>
</g>
</svg>