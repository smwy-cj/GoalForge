<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3050 454" width="3050" height="454" role="group" aria-label="目标有向无环图：从上到下展开目标，不表示操作先后">
<defs><marker id="dagArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#799b8c"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.goal-node rect{fill:#fff;stroke:#719c8c;stroke-width:1.5}.group-node rect{fill:#edf5f0;stroke:#8aaf9e;stroke-width:1.2}.dag-node{cursor:pointer;outline:none}.dag-node:focus rect,.dag-node.selected rect{stroke:#176d58;stroke-width:3}.dag-edge{fill:none;stroke:#799b8c;stroke-width:1.6}.dag-node:hover rect{fill:#e9f4ed}</style>
<rect width="100%" height="100%" fill="#f8fbf8"/>
<path class="dag-edge" data-group-edge="F01" d="M1251.0 128 C1251.0 159.0 1525.0 159.0 1525.0 190" marker-end="url(#dagArrow)"/>
<path class="dag-edge" data-group-edge="F01" d="M1525.0 232 C1525.0 263.0 1388.0 263.0 1388.0 294" marker-end="url(#dagArrow)"/>
<path class="dag-edge" data-group-edge="F01" d="M1525.0 232 C1525.0 263.0 1662.0 263.0 1662.0 294" marker-end="url(#dagArrow)"/>
<g class="dag-node goal-node" data-goal="G01" tabindex="0" role="button" aria-label="增加领英个人资料显示的人脉数量。"><title>增加领英个人资料显示的人脉数量。</title><rect x="38.0" y="38" width="234" height="76" rx="12"/>
<text x="155.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">增加领英个人资料显示的人脉</text>
<text x="155.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">数量。</text>
</g>
<g class="dag-node goal-node" data-goal="G02" tabindex="0" role="button" aria-label="让他人看出自己在领英上保持活跃。"><title>让他人看出自己在领英上保持活跃。</title><rect x="312.0" y="38" width="234" height="76" rx="12"/>
<text x="429.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">让他人看出自己在领英上保持</text>
<text x="429.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">活跃。</text>
</g>
<g class="dag-node goal-node" data-goal="G03" tabindex="0" role="button" aria-label="在申请实习或全职职位时，从目标公司的现任员工获得内推。"><title>在申请实习或全职职位时，从目标公司的现任员工获得内推。</title><rect x="586.0" y="38" width="234" height="90" rx="12"/>
<text x="703.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">在申请实习或全职职位时，从</text>
<text x="703.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">目标公司的现任员工获得内推</text>
<text x="703.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G04" tabindex="0" role="button" aria-label="借助内推增加简历被招聘人员看到的机会。"><title>借助内推增加简历被招聘人员看到的机会。</title><rect x="860.0" y="38" width="234" height="76" rx="12"/>
<text x="977.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">借助内推增加简历被招聘人员</text>
<text x="977.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">看到的机会。</text>
</g>
<g class="dag-node goal-node" data-goal="G05" tabindex="0" role="button" aria-label="求内推时，只选择同时是目标公司现任员工、又有本校就读背景的潜在人脉。"><title>求内推时，只选择同时是目标公司现任员工、又有本校就读背景的潜在人脉。</title><rect x="1134.0" y="38" width="234" height="90" rx="12"/>
<text x="1251.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">求内推时，只选择同时是目标</text>
<text x="1251.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">公司现任员工、又有本校就读</text>
<text x="1251.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">背景的潜在人脉。</text>
</g>
<g class="dag-node goal-node" data-goal="G06" tabindex="0" role="button" aria-label="求内推时，确认所选潜在人脉目前仍在目标公司任职。"><title>求内推时，确认所选潜在人脉目前仍在目标公司任职。</title><rect x="1271.0" y="294" width="234" height="76" rx="12"/>
<text x="1388.0" y="327.0" text-anchor="middle" font-size="15" fill="#203d38">求内推时，确认所选潜在人脉</text>
<text x="1388.0" y="347.0" text-anchor="middle" font-size="15" fill="#203d38">目前仍在目标公司任职。</text>
</g>
<g class="dag-node goal-node" data-goal="G07" tabindex="0" role="button" aria-label="求内推时，选择有本校就读背景的潜在人脉，以增加其愿意帮助的可能性。"><title>求内推时，选择有本校就读背景的潜在人脉，以增加其愿意帮助的可能性。</title><rect x="1545.0" y="294" width="234" height="90" rx="12"/>
<text x="1662.0" y="324.0" text-anchor="middle" font-size="15" fill="#203d38">求内推时，选择有本校就读背</text>
<text x="1662.0" y="344.0" text-anchor="middle" font-size="15" fill="#203d38">景的潜在人脉，以增加其愿意</text>
<text x="1662.0" y="364.0" text-anchor="middle" font-size="15" fill="#203d38">帮助的可能性。</text>
</g>
<g class="dag-node goal-node" data-goal="G08" tabindex="0" role="button" aria-label="发送连接邀请时，能够用附言介绍自己，并在需要时说明内推请求。"><title>发送连接邀请时，能够用附言介绍自己，并在需要时说明内推请求。</title><rect x="1408.0" y="38" width="234" height="90" rx="12"/>
<text x="1525.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">发送连接邀请时，能够用附言</text>
<text x="1525.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">介绍自己，并在需要时说明内</text>
<text x="1525.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">推请求。</text>
</g>
<g class="dag-node goal-node" data-goal="G09" tabindex="0" role="button" aria-label="连接邀请被接受后，能继续聊天沟通内推的进一步细节。"><title>连接邀请被接受后，能继续聊天沟通内推的进一步细节。</title><rect x="1682.0" y="38" width="234" height="76" rx="12"/>
<text x="1799.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">连接邀请被接受后，能继续聊</text>
<text x="1799.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">天沟通内推的进一步细节。</text>
</g>
<g class="dag-node goal-node" data-goal="G10" tabindex="0" role="button" aria-label="能够接触到足够多、符合自己寻找背景的人脉搜索结果。"><title>能够接触到足够多、符合自己寻找背景的人脉搜索结果。</title><rect x="1956.0" y="38" width="234" height="76" rx="12"/>
<text x="2073.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">能够接触到足够多、符合自己</text>
<text x="2073.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">寻找背景的人脉搜索结果。</text>
</g>
<g class="dag-node goal-node" data-goal="G11" tabindex="0" role="button" aria-label="通过调整搜索关键词，获得背景更符合自己要求的人脉结果。"><title>通过调整搜索关键词，获得背景更符合自己要求的人脉结果。</title><rect x="2230.0" y="38" width="234" height="90" rx="12"/>
<text x="2347.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">通过调整搜索关键词，获得背</text>
<text x="2347.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">景更符合自己要求的人脉结果</text>
<text x="2347.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">。</text>
</g>
<g class="dag-node goal-node" data-goal="G12" tabindex="0" role="button" aria-label="希望在邀请附言中充分表达想说的话，并减少为字符限制反复压缩措辞的负担。"><title>希望在邀请附言中充分表达想说的话，并减少为字符限制反复压缩措辞的负担。</title><rect x="2504.0" y="38" width="234" height="90" rx="12"/>
<text x="2621.0" y="68.0" text-anchor="middle" font-size="15" fill="#203d38">希望在邀请附言中充分表达想</text>
<text x="2621.0" y="88.0" text-anchor="middle" font-size="15" fill="#203d38">说的话，并减少为字符限制反</text>
<text x="2621.0" y="108.0" text-anchor="middle" font-size="15" fill="#203d38">复压缩措辞的负担。</text>
</g>
<g class="dag-node goal-node" data-goal="G13" tabindex="0" role="button" aria-label="寻找潜在人脉时，希望减少对昂贵付费会员的依赖。"><title>寻找潜在人脉时，希望减少对昂贵付费会员的依赖。</title><rect x="2778.0" y="38" width="234" height="76" rx="12"/>
<text x="2895.0" y="71.0" text-anchor="middle" font-size="15" fill="#203d38">寻找潜在人脉时，希望减少对</text>
<text x="2895.0" y="91.0" text-anchor="middle" font-size="15" fill="#203d38">昂贵付费会员的依赖。</text>
</g>
<g class="dag-node group-node" data-group="F01" tabindex="0" role="button" aria-label="审核这组层级：共同满足"><title>审核这组层级：共同满足</title><rect x="1438.0" y="190" width="174" height="42" rx="21"/>
<text x="1525.0" y="216.0" text-anchor="middle" font-size="13" fill="#203d38">共同满足</text>
</g>
</svg>